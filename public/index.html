<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terzex Chat</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #050505;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 90%;
      max-width: 400px;
      padding: 30px;
      background: #151515;
      border: 1px solid #d4af37;
      border-radius: 20px;
      text-align: center;
    }

    .logo {
      font-size: 32px;
      color: #d4af37;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      background: #222;
      color: white;
      border: 1px solid #444;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      background: #d4af37;
      color: black;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      color: #d4af37;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="logo">⚡ TERZEX CHAT</div>
    <p>Connect. Chat. Share.</p>

    <input id="name" type="text" placeholder="Your name">
    <input id="email" type="email" placeholder="Email address">
    <input id="password" type="password" placeholder="Password">

    <button id="register">CREATE ACCOUNT</button>
    <button id="login">LOG IN</button>

    <p id="message"></p>
  </div>

  <script type="module">

    import { initializeApp }
    from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      updateProfile
    } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

    // FIREBASE CONFIGURATION
    const firebaseConfig = {
      apiKey: "AIzaSyD9EIBvB_1wlUCa2f4XzxjHvulEoELjJ6o",
      authDomain: "terzex-chat.firebaseapp.com",
      projectId: "terzex-chat",
      storageBucket: "terzex-chat.firebasestorage.app",
      messagingSenderId: "439554401022",
      appId: "1:439554401022:web:2eddf4bebb81fab30ffbaf",
      measurementId: "G-9BQYK88HN9"
    };

    // INITIALIZE FIREBASE
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const message = document.getElementById("message");

    // CREATE ACCOUNT
    document.getElementById("register").onclick = async () => {

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!name || !email || !password) {
        message.textContent = "Please fill in all fields.";
        return;
      }

      try {
        const result = await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );

        await updateProfile(result.user, {
          displayName: name
        });

        message.textContent = "Account created successfully!";

        window.location.href = "/chat.html";

      } catch (error) {
        message.textContent = error.message;
      }
    };

    // LOGIN
    document.getElementById("login").onclick = async () => {

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        message.textContent = "Enter your email and password.";
        return;
      }

      try {
        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        message.textContent = "Welcome to Terzex Chat!";

        window.location.href = "/chat.html";

      } catch (error) {
        message.textContent = error.message;
      }
    };

  </script>

</body>
</html>
