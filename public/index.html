<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>Terzex Chat - Login</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #050505;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 420px;
  background: #111;
  border: 1px solid #292929;
  border-radius: 20px;
  padding: 28px;
  box-shadow: 0 0 30px rgba(255, 190, 0, 0.08);
}

.logo {
  text-align: center;
  font-size: 42px;
  font-weight: bold;
  color: #ffc400;
  margin-bottom: 5px;
}

h1 {
  text-align: center;
  margin: 0 0 8px;
  font-size: 25px;
}

.subtitle {
  text-align: center;
  color: #999;
  font-size: 14px;
  margin-bottom: 25px;
}

.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
}

.tabs button {
  flex: 1;
  background: #222;
  color: white;
  border: 1px solid #333;
  padding: 12px 5px;
  border-radius: 9px;
  cursor: pointer;
}

.tabs button.active {
  background: #ffc400;
  color: black;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  border: 1px solid #333;
  border-radius: 9px;
  background: #080808;
  color: white;
  outline: none;
  font-size: 15px;
}

input:focus {
  border-color: #ffc400;
}

label {
  display: block;
  color: #ccc;
  font-size: 13px;
  margin-top: 10px;
}

.main-btn {
  width: 100%;
  padding: 14px;
  background: #ffc400;
  color: black;
  border: none;
  border-radius: 9px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 15px;
}

.main-btn:disabled {
  opacity: 0.6;
  cursor: wait;
}

.secondary-btn {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  background: #222;
  color: #ffc400;
  border: 1px solid #444;
  border-radius: 9px;
  cursor: pointer;
}

.link {
  display: block;
  text-align: center;
  color: #ffc400;
  margin-top: 17px;
  cursor: pointer;
  font-size: 14px;
}

.remember {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #ccc;
  font-size: 13px;
  margin-top: 12px;
}

.remember input {
  width: auto;
  margin: 0;
}

.message {
  padding: 11px;
  border-radius: 8px;
  margin-top: 15px;
  display: none;
  font-size: 13px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.error {
  display: block;
  background: #351313;
  color: #ff9999;
}

.success {
  display: block;
  background: #12331b;
  color: #9cffad;
}

.hidden {
  display: none !important;
}

.footer {
  text-align: center;
  color: #666;
  font-size: 12px;
  margin-top: 25px;
}

#recaptcha-container {
  margin-top: 12px;
  overflow: hidden;
}

</style>
</head>

<body>

<div class="container">

  <div class="logo">ϟ</div>

  <h1>Terzex Chat</h1>

  <div class="subtitle">
    Connect. Chat. Share.
  </div>

  <div class="tabs">
    <button id="emailTab" class="active"
      onclick="showMode('email')">Email</button>

    <button id="phoneTab"
      onclick="showMode('phone')">Phone</button>
  </div>

  <!-- EMAIL LOGIN -->

  <div id="emailSection">

    <div id="nameGroup" class="hidden">
      <label>Your name</label>
      <input id="displayName"
        type="text"
        placeholder="Enter your name">
    </div>

    <label>Email address</label>
    <input id="email"
      type="email"
      placeholder="Enter your email">

    <label>Password</label>
    <input id="password"
      type="password"
      placeholder="Enter your password">

    <div id="rememberGroup" class="remember">
      <input type="checkbox" id="rememberMe" checked>
      <span>Remember me</span>
    </div>

    <button class="main-btn"
      id="emailButton"
      onclick="emailLogin()">
      Login
    </button>

    <button class="secondary-btn"
      id="createButton"
      onclick="createAccount()">
      Create Account
    </button>

    <span class="link"
      onclick="forgotPassword()">
      Forgot password?
    </span>

  </div>

  <!-- PHONE LOGIN -->

  <div id="phoneSection" class="hidden">

    <label>Your phone number</label>

    <input id="phoneNumber"
      type="tel"
      placeholder="+2348012345678">

    <div id="recaptcha-container"></div>

    <button class="main-btn"
      id="sendCodeButton"
      onclick="sendPhoneCode()">
      Send Verification Code
    </button>

    <div id="verificationSection" class="hidden">

      <label>SMS verification code</label>

      <input id="verificationCode"
        type="text"
        inputmode="numeric"
        placeholder="Enter the 6-digit code">

      <button class="main-btn"
        onclick="verifyPhoneCode()">
        Verify and Login
      </button>

    </div>

    <p style="color:#888;font-size:12px;line-height:1.5;">
      Enter your number with its country code.
      For example: +2348012345678.
      A verification code will be sent to your phone.
    </p>

  </div>

  <div id="message" class="message"></div>

  <div class="footer">
    © 2026 Terzex Chat
  </div>

</div>

<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<script>

// =====================================
// YOUR ORIGINAL FIREBASE CONFIGURATION
// =====================================

const firebaseConfig = {
  apiKey: "AIzaSyD9EIBvB_1wlUCa2f4XzxjHvulEoELjJ6o",
  authDomain: "terzex-chat.firebaseapp.com",
  projectId: "terzex-chat",
  storageBucket: "terzex-chat.firebasestorage.app",
  messagingSenderId: "439554401022",
  appId: "1:439554401022:web:2eddf4bebb81fab30ffbaf",
  measurementId: "G-9BQYK88HN9"
};

// Start Firebase

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();


// =====================================
// GENERAL FUNCTIONS
// =====================================

function showMessage(text, type = "error") {
  const box = document.getElementById("message");

  box.textContent = text;
  box.className = "message " + type;
}

function clearMessage() {
  const box = document.getElementById("message");

  box.textContent = "";
  box.className = "message";
}

function setLoading(buttonId, loading, originalText) {
  const button = document.getElementById(buttonId);

  button.disabled = loading;
  button.textContent = loading ? "Please wait..." : originalText;
}


// =====================================
// SWITCH EMAIL / PHONE
// =====================================

function showMode(mode) {
  clearMessage();

  document.getElementById("emailSection")
    .classList.toggle("hidden", mode !== "email");

  document.getElementById("phoneSection")
    .classList.toggle("hidden", mode !== "phone");

  document.getElementById("emailTab")
    .classList.toggle("active", mode === "email");

  document.getElementById("phoneTab")
    .classList.toggle("active", mode === "phone");
}


// =====================================
// SWITCH LOGIN / CREATE ACCOUNT
// =====================================

let accountMode = "login";

function showCreateMode() {
  accountMode = "create";

  document.getElementById("nameGroup")
    .classList.remove("hidden");

  document.getElementById("rememberGroup")
    .classList.add("hidden");

  document.getElementById("emailButton")
    .classList.add("hidden");

  document.getElementById("createButton")
    .textContent = "Register Account";

  document.getElementById("createButton")
    .onclick = createAccount;

  clearMessage();
}


// =====================================
// SAVE USER PROFILE IN FIRESTORE
// =====================================

async function saveUserProfile(user, name = "") {

  const userRef = db.collection("users").doc(user.uid);

  const userDoc = await userRef.get();

  const profile = {
    uid: user.uid,
    email: user.email || null,
    phoneNumber: user.phoneNumber || null,
    lastSeen: firebase.firestore.FieldValue.serverTimestamp()
  };

  if (!userDoc.exists) {
    profile.createdAt =
      firebase.firestore.FieldValue.serverTimestamp();

    profile.displayName =
      name || user.displayName || "Terzex User";

    profile.bio = "";
    profile.photoURL = user.photoURL || "";
  } else if (name) {
    profile.displayName = name;
  }

  await userRef.set(profile, { merge: true });
}


// =====================================
// GO TO CHAT
// =====================================

function goToChat() {
  window.location.href = "chat.html";
}


// =====================================
// EMAIL LOGIN
// =====================================

async function emailLogin() {

  clearMessage();

  const email = document.getElementById("email")
    .value.trim();

  const password = document.getElementById("password")
    .value;

  if (!email || !password) {
    showMessage("Please enter your email and password.");
    return;
  }

  setLoading("emailButton", true, "Login");

  try {

    const remember =
      document.getElementById("rememberMe").checked;

    await auth.setPersistence(
      remember
        ? firebase.auth.Auth.Persistence.LOCAL
        : firebase.auth.Auth.Persistence.SESSION
    );

    const result = await auth.signInWithEmailAndPassword(
      email,
      password
    );

    await saveUserProfile(result.user);

    showMessage("Login successful!", "success");

    setTimeout(goToChat, 800);

  } catch (error) {

    showMessage(error.message);

  } finally {

    setLoading("emailButton", false, "Login");

  }
}


// =====================================
// CREATE EMAIL ACCOUNT
// =====================================

async function createAccount() {

  clearMessage();

  const name = document.getElementById("displayName")
    .value.trim();

  const email = document.getElementById("email")
    .value.trim();

  const password = document.getElementById("password")
    .value;

  if (!name || !email || !password) {
    showMessage("Please enter your name, email and password.");
    return;
  }

  if (password.length < 6) {
    showMessage("Your password must contain at least 6 characters.");
    return;
  }

  setLoading("createButton", true, "Create Account");

  try {

    const result = await auth.createUserWithEmailAndPassword(
      email,
      password
    );

    await result.user.updateProfile({
      displayName: name
    });

    await saveUserProfile(result.user, name);

    showMessage(
      "Your Terzex account was created successfully!",
      "success"
    );

    setTimeout(goToChat, 1000);

  } catch (error) {

    showMessage(error.message);

  } finally {

    setLoading("createButton", false, "Create Account");

  }
}


// =====================================
// FORGOT PASSWORD
// =====================================

async function forgotPassword() {

  clearMessage();

  const email = document.getElementById("email")
    .value.trim();

  if (!email) {
    showMessage("Enter your email address first.");
    return;
  }

  try {

    await auth.sendPasswordResetEmail(email);

    showMessage(
      "Password reset instructions have been sent to your email.",
      "success"
    );

  } catch (error) {

    showMessage(error.message);

  }
}


// =====================================
// PHONE NUMBER LOGIN
// =====================================

let confirmationResult = null;
let recaptchaVerifier = null;

async function sendPhoneCode() {

  clearMessage();

  const phone = document.getElementById("phoneNumber")
    .value.trim();

  if (!phone.startsWith("+")) {
    showMessage(
      "Enter your phone number with its country code, for example +2348012345678."
    );
    return;
  }

  try {

    setLoading(
      "sendCodeButton",
      true,
      "Send Verification Code"
    );

    if (!recaptchaVerifier) {

      recaptchaVerifier =
        new firebase.auth.RecaptchaVerifier(
          "recaptcha-container",
          {
            size: "normal"
          }
        );

      await recaptchaVerifier.render();
    }

    confirmationResult =
      await auth.signInWithPhoneNumber(
        phone,
        recaptchaVerifier
      );

    document.getElementById("verificationSection")
      .classList.remove("hidden");

    showMessage(
      "Verification code sent to your phone.",
      "success"
    );

  } catch (error) {

    showMessage(error.message);

    if (recaptchaVerifier) {
      recaptchaVerifier.clear();
      recaptchaVerifier = null;
    }

  } finally {

    setLoading(
      "sendCodeButton",
      false,
      "Send Verification Code"
    );

  }
}


// =====================================
// VERIFY PHONE CODE
// =====================================

async function verifyPhoneCode() {

  clearMessage();

  const code = document.getElementById("verificationCode")
    .value.trim();

  if (!code) {
    showMessage("Enter the verification code.");
    return;
  }

  try {

    if (!confirmationResult) {
      showMessage("Please request a new verification code.");
      return;
    }

    const result = await confirmationResult.confirm(code);

    await saveUserProfile(result.user);

    showMessage(
      "Phone verification successful!",
      "success"
    );

    setTimeout(goToChat, 1000);

  } catch (error) {

    showMessage(error.message);

  }
}


// =====================================
// CHECK EXISTING LOGIN
// =====================================

auth.onAuthStateChanged(async function(user) {

  if (user) {

    try {

      await saveUserProfile(user);

      // Keep the login page visible until the user
      // chooses to log in or create an account.

    } catch (error) {

      console.error("Profile error:", error);

    }

  }

});

</script>

</body>
</html>
