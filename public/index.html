<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050505">
<title>Terzex Chat - Welcome Back</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;background:#030303;color:white;
 font-family:Arial,sans-serif;display:flex;align-items:center;
 justify-content:center;padding:22px;
}
.card{
 width:100%;max-width:420px;padding:30px 25px;
 border:1px solid #d6a52c;border-radius:28px;
 background:radial-gradient(ellipse at top,#302000 0%,#090909 48%,#030303 100%);
 box-shadow:0 0 28px #d99c2440,inset 0 0 20px #d99c2410;
}
.logo{
 width:105px;height:105px;margin:0 auto 15px;border-radius:50%;
 border:2px solid #ffc52e;display:flex;align-items:center;
 justify-content:center;font-size:76px;font-weight:bold;
 color:#ffd34e;text-shadow:0 0 18px #ffb900;
 box-shadow:0 0 25px #ffbd2d70;
}
.brand{text-align:center;color:#ffc52e;font-size:30px;font-weight:bold}
.subtitle{text-align:center;color:#d5c69c;margin:10px 0 25px}
h2{text-align:center;margin:0 0 8px;font-size:25px}
.tabs{display:flex;gap:10px;margin:20px 0}
.tabs button{
 flex:1;padding:13px;border-radius:30px;border:1px solid #99732a;
 background:#111;color:#eacb78;font-weight:bold;
}
.tabs button.active{background:linear-gradient(90deg,#d99c20,#ffe16b);color:#111}
label{display:block;margin:13px 0 7px;color:#e7d39c;font-size:13px}
input{
 width:100%;padding:15px;border-radius:14px;
 border:1px solid #725721;background:#0b0b0b;
 color:white;font-size:15px;outline:none;
}
input:focus{border-color:#ffd04a;box-shadow:0 0 10px #d99c2440}
.password-wrap{position:relative}
.password-wrap input{padding-right:65px}
.showpass{
 position:absolute;right:12px;top:50%;transform:translateY(-50%);
 border:0;background:none;color:#f4c64e;
}
.gold{
 width:100%;padding:16px;margin-top:20px;border:0;
 border-radius:30px;background:linear-gradient(90deg,#d99b1b,#ffe16a);
 color:#100c02;font-size:17px;font-weight:bold;
 box-shadow:0 0 18px #d99c2450;
}
.social{
 width:100%;padding:14px;margin-top:12px;border-radius:30px;
 border:1px solid #8c6b2c;background:#101010;color:white;
 font-size:15px;
}
.social:disabled,.gold:disabled{opacity:.6}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:#aaa}
.divider:before,.divider:after{content:"";height:1px;background:#55421e;flex:1}
.link{text-align:center;color:#ffd04a;margin-top:18px;font-size:14px}
.link span{cursor:pointer}
.message{display:none;margin-top:15px;padding:12px;border-radius:10px;font-size:13px;line-height:1.5;overflow-wrap:anywhere}
.error{display:block;background:#381313;color:#ffaaaa}
.success{display:block;background:#12351c;color:#a5ffb0}
.hidden{display:none!important}
.footer{text-align:center;color:#777;font-size:12px;margin-top:25px}
#recaptcha-container{margin-top:12px}
</style>
</head>

<body>
<div class="card">

 <div class="logo">ϟ</div>
 <div class="brand">Terzex Chat</div>
 <div class="subtitle">Connect Without Borders</div>

 <h2 id="heading">Welcome Back</h2>
 <p id="description" style="text-align:center;color:#aaa;font-size:14px">
 Sign in to continue
 </p>

 <div class="tabs">
  <button id="loginTab" class="active" onclick="setMode('login')">Sign In</button>
  <button id="signupTab" onclick="setMode('signup')">Sign Up</button>
 </div>

 <div id="emailForm">

  <div id="nameField" class="hidden">
   <label>Full Name</label>
   <input id="fullName" placeholder="Enter your full name" autocomplete="name">

   <label>Username</label>
   <input id="username" placeholder="Choose a username">
  </div>

  <label id="identifierLabel">Phone Number or Username</label>
  <input id="identifier" placeholder="Email address or username" autocomplete="username">

  <div id="emailSignupPhone" class="hidden">
   <label>Phone Number</label>
   <input id="signupPhone" type="tel" placeholder="+2348012345678">
  </div>

  <label>Password</label>
  <div class="password-wrap">
   <input id="password" type="password" placeholder="Enter password" autocomplete="current-password">
   <button class="showpass" type="button" onclick="togglePassword('password',this)">Show</button>
  </div>

  <div id="confirmField" class="hidden">
   <label>Confirm Password</label>
   <div class="password-wrap">
    <input id="confirmPassword" type="password" placeholder="Confirm password">
    <button class="showpass" type="button" onclick="togglePassword('confirmPassword',this)">Show</button>
   </div>
  </div>

  <button class="gold" id="mainButton" onclick="submitEmail()">Sign In</button>

  <div id="forgot" class="link">
   <span onclick="forgotPassword()">Forgot Password?</span>
  </div>

 </div>

 <div class="divider">or</div>

 <button class="social" id="googleButton" onclick="socialLogin('google')">
  🌐 &nbsp; Continue with Google
 </button>

 <button class="social" id="appleButton" onclick="socialLogin('apple')">
   &nbsp; Continue with Apple
 </button>

 <div class="divider">or use your phone</div>

 <div id="phoneForm">
  <label>Phone Number with Country Code</label>
  <input id="phoneNumber" type="tel" placeholder="+2348012345678">

  <div id="recaptcha-container"></div>

  <button class="social" id="sendCode" onclick="sendPhoneCode()">
   Send Verification Code
  </button>

  <div id="verifyArea" class="hidden">
   <label>SMS Verification Code</label>
   <input id="smsCode" inputmode="numeric" placeholder="Enter 6-digit code">
   <button class="gold" onclick="verifyPhoneCode()">Verify Phone</button>
  </div>
 </div>

 <div id="message" class="message"></div>

 <div class="footer">© 2026 TERZEX CHAT</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<script>
// KEEP YOUR EXISTING FIREBASE CONFIGURATION HERE
const firebaseConfig = {
 apiKey: "AIzaSyD9EIBvB_1wlUCa2f4XzxjHvulEoELjJ6o",
 authDomain: "terzex-chat.firebaseapp.com",
 projectId: "terzex-chat",
 storageBucket: "terzex-chat.firebasestorage.app",
 messagingSenderId: "439554401022",
 appId: "1:439554401022:web:2eddf4bebb81fab30ffbaf",
 measurementId: "G-9BQYK88HN9"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let mode = "login";
let confirmationResult = null;
let recaptchaVerifier = null;

function message(text,type="error"){
 const box=document.getElementById("message");
 box.textContent=text;
 box.className="message "+type;
}
function clearMessage(){
 const box=document.getElementById("message");
 box.textContent="";
 box.className="message";
}
function togglePassword(id,button){
 const input=document.getElementById(id);
 input.type=input.type==="password"?"text":"password";
 button.textContent=input.type==="password"?"Show":"Hide";
}

function setMode(value){
 mode=value;
 clearMessage();

 document.getElementById("loginTab").classList.toggle("active",value==="login");
 document.getElementById("signupTab").classList.toggle("active",value==="signup");

 document.getElementById("nameField").classList.toggle("hidden",value!=="signup");
 document.getElementById("emailSignupPhone").classList.toggle("hidden",value!=="signup");
 document.getElementById("confirmField").classList.toggle("hidden",value!=="signup");
 document.getElementById("forgot").classList.toggle("hidden",value!=="login");

 document.getElementById("heading").textContent=value==="login"?"Welcome Back":"Create Your Account";
 document.getElementById("description").textContent=value==="login"?"Sign in to continue":"Join the Terzex community";
 document.getElementById("mainButton").textContent=value==="login"?"Sign In":"Create Account";
 document.getElementById("identifierLabel").textContent=value==="login"?"Email Address or Username":"Email Address";
 document.getElementById("identifier").placeholder=value==="login"?"Email address or username":"Enter your email";
 document.getElementById("identifier").type="text";
 document.getElementById("password").autocomplete=value==="login"?"current-password":"new-password";
}

async function saveProfile(user,extra={}){
 const ref=db.collection("users").doc(user.uid);
 const existing=await ref.get();
 const data={
  uid:user.uid,
  email:user.email||null,
  phoneNumber:user.phoneNumber||extra.phoneNumber||null,
  lastSeen:firebase.firestore.FieldValue.serverTimestamp()
 };
 if(!existing.exists){
  data.createdAt=firebase.firestore.FieldValue.serverTimestamp();
  data.displayName=extra.name||user.displayName||"Terzex User";
  data.username=extra.username||"";
  data.usernameLower=(extra.username||"").toLowerCase();
  data.photoURL=user.photoURL||"";
  data.bio="";
 }else{
  if(extra.name)data.displayName=extra.name;
  if(extra.username){
   data.username=extra.username;
   data.usernameLower=extra.username.toLowerCase();
  }
 }
 await ref.set(data,{merge:true});
}

function goToChat(){
 window.location.href="chat.html";
}

async function submitEmail(){
 clearMessage();
 const identifier=document.getElementById("identifier").value.trim();
 const password=document.getElementById("password").value;

 if(!identifier||!password){
  message("Please enter your email or username and password.");
  return;
 }

 const button=document.getElementById("mainButton");
 button.disabled=true;
 button.textContent="Please wait...";

 try{
  if(mode==="signup"){
   const name=document.getElementById("fullName").value.trim();
   const username=document.getElementById("username").value.trim();
   const phone=document.getElementById("signupPhone").value.trim();
   const confirm=document.getElementById("confirmPassword").value;

   if(!name||!username||!identifier.includes("@")){
    throw new Error("Enter your full name, username and a valid email address.");
   }
   if(!/^[a-zA-Z0-9_]{3,20}$/.test(username)){
    throw new Error("Username must be 3–20 characters using letters, numbers or underscores.");
   }
   if(password.length<8)throw new Error("Use a password with at least 8 characters.");
   if(password!==confirm)throw new Error("Your passwords do not match.");

   const usernameCheck=await db.collection("users")
    .where("usernameLower","==",username.toLowerCase()).limit(1).get();

   if(!usernameCheck.empty)throw new Error("That username is already taken.");

   const result=await auth.createUserWithEmailAndPassword(identifier,password);
   await result.user.updateProfile({displayName:name});
   await saveProfile(result.user,{name,username,phoneNumber:phone});

   message("Your Terzex account has been created!","success");
   setTimeout(goToChat,1000);

  }else{
   let email=identifier;

   if(!identifier.includes("@")){
    const found=await db.collection("users")
     .where("usernameLower","==",identifier.toLowerCase()).limit(1).get();

    if(found.empty)throw new Error("Username not found. Check your details.");
    email=found.docs[0].data().email;
    if(!email)throw new Error("This account has no email login.");
   }

   const result=await auth.signInWithEmailAndPassword(email,password);
   await saveProfile(result.user);
   message("Welcome back!","success");
   setTimeout(goToChat,800);
  }
 }catch(error){
  message(error.message);
 }finally{
  button.disabled=false;
  button.textContent=mode==="login"?"Sign In":"Create Account";
 }
}

async function socialLogin(providerName){
 clearMessage();
 try{
  let provider;
  if(providerName==="google"){
   provider=new firebase.auth.GoogleAuthProvider();
   provider.setCustomParameters({prompt:"select_account"});
  }else{
   provider=new firebase.auth.OAuthProvider("apple.com");
   provider.addScope("email");
   provider.addScope("name");
  }

  const result=await auth.signInWithPopup(provider);
  await saveProfile(result.user);
  message("Signed in successfully!","success");
  setTimeout(goToChat,800);
 }catch(error){
  message(error.message);
 }
}

async function forgotPassword(){
 clearMessage();
 const email=document.getElementById("identifier").value.trim();

 if(!email||!email.includes("@")){
  message("Enter your email address first.");
  return;
 }
 try{
  await auth.sendPasswordResetEmail(email);
  message("Password reset email sent. Check your inbox.","success");
 }catch(error){
  message(error.message);
 }
}

async function sendPhoneCode(){
 clearMessage();
 const phone=document.getElementById("phoneNumber").value.trim();

 if(!phone.startsWith("+")){
  message("Include your country code, for example +2348012345678.");
  return;
 }

 try{
  if(!recaptchaVerifier){
   recaptchaVerifier=new firebase.auth.RecaptchaVerifier(
    "recaptcha-container",{size:"normal"}
   );
   await recaptchaVerifier.render();
  }

  confirmationResult=await auth.signInWithPhoneNumber(phone,recaptchaVerifier);
  document.getElementById("verifyArea").classList.remove("hidden");
  message("Verification code sent!","success");
 }catch(error){
  message(error.message);
  if(recaptchaVerifier){
   recaptchaVerifier.clear();
   recaptchaVerifier=null;
  }
 }
}

async function verifyPhoneCode(){
 clearMessage();
 const code=document.getElementById("smsCode").value.trim();
 if(!confirmationResult||!code){
  message("Request a verification code and enter it.");
  return;
 }
 try{
  const result=await confirmationResult.confirm(code);
  await saveProfile(result.user);
  message("Phone verified successfully!","success");
  setTimeout(goToChat,800);
 }catch(error){
  message(error.message);
 }
}
</script>
</body>
</html>
