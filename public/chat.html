<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050505">
<title>Terzex Chat - Dashboard</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#030303;
 color:white;
 font-family:Arial,sans-serif;
 min-height:100vh;
}

.app{
 max-width:480px;
 margin:auto;
 min-height:100vh;
 background:#050505;
 padding-bottom:85px;
}

header{
 padding:20px 17px 12px;
 display:flex;
 align-items:center;
 justify-content:space-between;
}

.brand{
 color:#ffd34e;
 font-size:25px;
 font-weight:bold;
 text-shadow:0 0 12px #d99c24;
}

.header-actions{
 display:flex;
 gap:14px;
}

.icon{
 background:#151515;
 border:1px solid #76591f;
 border-radius:50%;
 width:39px;
 height:39px;
 color:#ffd34e;
 font-size:19px;
}

.search{
 margin:8px 15px 18px;
}

.search input{
 width:100%;
 padding:14px 18px;
 border-radius:30px;
 border:1px solid #55421e;
 background:#171717;
 color:white;
 outline:none;
 font-size:14px;
}

.search input:focus{
 border-color:#ffd34e;
}

.section-title{
 color:#ffd34e;
 font-size:16px;
 font-weight:bold;
 margin:20px 17px 12px;
}

.stories{
 display:flex;
 overflow-x:auto;
 gap:17px;
 padding:5px 15px 15px;
 scrollbar-width:none;
}

.story{
 flex:0 0 65px;
 text-align:center;
 font-size:12px;
 color:#ddd;
}

.story-ring{
 width:59px;
 height:59px;
 border-radius:50%;
 border:2px solid #eab52c;
 padding:3px;
 margin:auto auto 7px;
 display:flex;
 align-items:center;
 justify-content:center;
 background:#171717;
 color:#ffd34e;
 font-size:22px;
}

.story-ring img{
 width:100%;
 height:100%;
 object-fit:cover;
 border-radius:50%;
}

.online{
 border-color:#20d66b;
}

.chat-list{
 padding:0 13px;
}

.chat-item{
 display:flex;
 align-items:center;
 gap:12px;
 padding:13px 3px;
 border-bottom:1px solid #242018;
 cursor:pointer;
}

.avatar{
 width:53px;
 height:53px;
 flex-shrink:0;
 border-radius:50%;
 background:linear-gradient(135deg,#3a2800,#b58113);
 border:1px solid #d9aa35;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:23px;
 color:#ffd34e;
 font-weight:bold;
 overflow:hidden;
}

.avatar img{
 width:100%;
 height:100%;
 object-fit:cover;
}

.chat-info{
 flex:1;
 min-width:0;
}

.chat-name{
 font-size:15px;
 font-weight:bold;
 margin-bottom:7px;
}

.last-message{
 color:#999;
 font-size:12px;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}

.chat-meta{
 text-align:right;
 font-size:11px;
 color:#aaa;
}

.badge{
 display:inline-flex;
 align-items:center;
 justify-content:center;
 min-width:19px;
 height:19px;
 border-radius:50%;
 background:#20d66b;
 color:black;
 font-weight:bold;
 margin-top:8px;
 padding:0 5px;
}

.empty{
 text-align:center;
 padding:35px 15px;
 color:#aaa;
 font-size:14px;
 line-height:1.7;
}

.empty strong{
 color:#ffd34e;
}

.bottom-nav{
 position:fixed;
 bottom:0;
 left:50%;
 transform:translateX(-50%);
 width:100%;
 max-width:480px;
 height:75px;
 background:#090909;
 border-top:1px solid #8a6827;
 display:flex;
 justify-content:space-around;
 align-items:center;
 z-index:10;
}

.nav-item{
 background:none;
 border:0;
 color:#999;
 font-size:11px;
 display:flex;
 flex-direction:column;
 align-items:center;
 gap:5px;
 cursor:pointer;
}

.nav-item span{
 font-size:21px;
}

.nav-item.active{
 color:#ffd34e;
}

.modal{
 display:none;
 position:fixed;
 inset:0;
 background:#000d;
 z-index:20;
 align-items:center;
 justify-content:center;
 padding:20px;
}

.modal-box{
 width:100%;
 max-width:380px;
 background:#101010;
 border:1px solid #d6a52c;
 border-radius:22px;
 padding:25px;
 box-shadow:0 0 25px #d99c2440;
}

.modal-box h2{
 color:#ffd34e;
}

.modal-box button{
 width:100%;
 padding:14px;
 margin-top:12px;
 border-radius:25px;
 border:1px solid #98752c;
 background:#191919;
 color:white;
}

.close{
 float:right;
 color:#ffd34e;
 background:none!important;
 border:none!important;
 width:auto!important;
 padding:0!important;
 margin:0!important;
}

.gold-button{
 background:linear-gradient(90deg,#d99b1b,#ffe16a)!important;
 color:#111!important;
 font-weight:bold;
}

.notice{
 color:#ffd34e;
 font-size:13px;
 text-align:center;
 margin-top:15px;
}

</style>
</head>

<body>

<div class="app">

<header>
 <div class="brand">Terzex Chat</div>

 <div class="header-actions">
  <button class="icon" onclick="openFeature('Camera')">◎</button>
  <button class="icon" onclick="openFeature('More options')">⋮</button>
 </div>
</header>

<div class="search">
 <input
  id="searchInput"
  type="search"
  placeholder="⌕  Search chats..."
  oninput="filterChats()">
</div>

<div class="section-title">Stories & Status</div>

<div class="stories">

 <div class="story" onclick="openFeature('My Story')">
  <div class="story-ring">＋</div>
  My Story
 </div>

 <div class="story">
  <div class="story-ring online">T</div>
  Sarah
 </div>

 <div class="story">
  <div class="story-ring online">M</div>
  Mike
 </div>

 <div class="story">
  <div class="story-ring">B</div>
  Bella
 </div>

 <div class="story">
  <div class="story-ring">D</div>
  David
 </div>

</div>

<div class="section-title">Recent Chats</div>

<div class="chat-list" id="chatList">

 <div class="empty" id="loading">
  <strong>ϟ Terzex Chat</strong><br>
  Loading your conversations...
 </div>

</div>

</div>

<nav class="bottom-nav">

 <button class="nav-item active" onclick="navigate('Chats')">
  <span>💬</span>Chats
 </button>

 <button class="nav-item" onclick="navigate('Calls')">
  <span>📞</span>Calls
 </button>

 <button class="nav-item" onclick="navigate('Communities')">
  <span>👥</span>Communities
 </button>

 <button class="nav-item" onclick="navigate('Status')">
  <span>◉</span>Status
 </button>

 <button class="nav-item" onclick="navigate('Settings')">
  <span>⚙</span>Settings
 </button>

</nav>

<div class="modal" id="featureModal">
 <div class="modal-box">
  <button class="close" onclick="closeModal()">✕</button>
  <h2 id="modalTitle">Terzex Chat</h2>
  <p id="modalText">
   Welcome to Terzex Chat.
  </p>
  <button class="gold-button" onclick="closeModal()">Continue</button>
 </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<script>

// USE THE SAME FIREBASE CONFIGURATION
// FROM YOUR EXISTING index.html FILE.

const firebaseConfig = {
 apiKey: "AIzaSyD9EIBvB_1wlUCa2f4XzxjHvulEoELjJ6o",
 authDomain: "terzex-chat.firebaseapp.com",
 projectId: "terzex-chat",
 storageBucket: "terzex-chat.firebasestorage.app",
 messagingSenderId: "439554401022",
 appId: "1:439554401022:web:2eddf4bebb81fab30ffbaf",
 measurementId: "G-9BQYK88HN9"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;
let allChats = [];

function showModal(title,text){
 document.getElementById("modalTitle").textContent=title;
 document.getElementById("modalText").textContent=text;
 document.getElementById("featureModal").style.display="flex";
}

function closeModal(){
 document.getElementById("featureModal").style.display="none";
}

function openFeature(name){
 showModal(name,name+" is part of the Terzex Chat platform. We're building this feature in stages.");
}

function navigate(name){

 document.querySelectorAll(".nav-item").forEach(item=>{
  item.classList.remove("active");
 });

 event.currentTarget.classList.add("active");

 if(name==="Chats"){
  return;
 }

 const descriptions={
  Calls:"Voice and video calling.",
  Communities:"Groups, channels and communities.",
  Status:"Stories and status updates.",
  Settings:"Your profile, privacy and account settings."
 };

 showModal(name,descriptions[name]);
}

function filterChats(){

 const value=document.getElementById("searchInput").value.toLowerCase();

 document.querySelectorAll(".chat-item").forEach(item=>{
  item.style.display=item.dataset.search.includes(value)?"flex":"none";
 });

}

function renderChats(chats){

 const container=document.getElementById("chatList");

 if(chats.length===0){
  container.innerHTML=`
   <div class="empty">
    <strong>Welcome to Terzex Chat!</strong><br><br>
    Your conversations will appear here.<br>
    Start connecting with people around the world.
   </div>`;
  return;
 }

 container.innerHTML="";

 chats.forEach(chat=>{

  const data=chat.data;
  const name=data.name||data.title||"Terzex Conversation";
  const last=data.lastMessage||"Start a conversation";
  const time=data.lastMessageTime?.toDate?
   data.lastMessageTime.toDate().toLocaleTimeString([],{
    hour:"2-digit",minute:"2-digit"
   }):"";

  const item=document.createElement("div");
  item.className="chat-item";
  item.dataset.search=name.toLowerCase()+" "+last.toLowerCase();

  const avatar=document.createElement("div");
  avatar.className="avatar";
  avatar.textContent=name.charAt(0).toUpperCase();

  const info=document.createElement("div");
  info.className="chat-info";

  const chatName=document.createElement("div");
  chatName.className="chat-name";
  chatName.textContent=name;

  const message=document.createElement("div");
  message.className="last-message";
  message.textContent=last;

  info.append(chatName,message);

  const meta=document.createElement("div");
  meta.className="chat-meta";
  meta.textContent=time;

  item.append(avatar,info,meta);

  item.onclick=()=>{
   showModal(name,"Conversation selected. We'll connect this to the full messaging screen next.");
  };

  container.appendChild(item);

 });

}

auth.onAuthStateChanged(async user=>{

 if(!user){
  window.location.href="index.html";
  return;
 }

 currentUser=user;

 try{

  const profile=await db.collection("users").doc(user.uid).get();

  if(profile.exists){
   const data=profile.data();
   const display=data.displayName||user.displayName||"";
   document.querySelector(".brand").textContent=
    display? "Terzex Chat":"Terzex Chat";
  }

  // Expected chat structure:
  // chats/{chatId}
  // participants: [userUid1, userUid2]
  // name: "Chat name"
  // lastMessage: "Latest message"
  // lastMessageTime: Firestore Timestamp

  db.collection("chats")
   .where("participants","array-contains",user.uid)
   .onSnapshot(snapshot=>{

    allChats=snapshot.docs.map(doc=>({
     id:doc.id,
     data:doc.data()
    }));

    renderChats(allChats);

   },error=>{

    document.getElementById("chatList").innerHTML=`
     <div class="empty">
      Your dashboard is ready.<br><br>
      <strong>Chat database connection needs checking.</strong><br>
      ${error.code||"Connection error"}
     </div>`;

   });

 }catch(error){

  document.getElementById("chatList").innerHTML=`
   <div class="empty">
    Dashboard loaded.<br>
    Profile information could not be loaded.
   </div>`;

 }

});

</script>

</body>
</html>
