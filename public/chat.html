<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terzex Chat</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080808;
  color: #fff;
  font-family: Arial, sans-serif;
}

button, input {
  font: inherit;
}

button {
  cursor: pointer;
}

.app {
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

header {
  height: 65px;
  background: #111;
  border-bottom: 1px solid #d4af37;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  flex-shrink: 0;
}

.logo {
  color: #d4af37;
  font-size: 21px;
  font-weight: bold;
}

#logoutBtn {
  background: #d4af37;
  color: #000;
  border: 0;
  padding: 10px 15px;
  border-radius: 7px;
  font-weight: bold;
}

#status {
  background: #111;
  color: #d4af37;
  padding: 8px 15px;
  font-size: 12px;
}

.layout {
  display: flex;
  flex: 1;
  min-height: 0;
}

.sidebar {
  width: 350px;
  background: #101010;
  border-right: 1px solid #292929;
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.sidebarTitle {
  padding: 18px;
  color: #d4af37;
  font-size: 20px;
  font-weight: bold;
}

.search {
  padding: 0 13px 15px;
}

.search input {
  width: 100%;
  padding: 12px;
  border-radius: 22px;
  border: 1px solid #333;
  background: #202020;
  color: white;
  outline: none;
}

.tabs {
  display: flex;
  padding: 0 10px 12px;
  gap: 7px;
}

.tabs button {
  flex: 1;
  padding: 10px 4px;
  background: #202020;
  color: white;
  border: 0;
  border-radius: 7px;
  font-size: 12px;
}

.tabs button.active {
  background: #d4af37;
  color: #000;
  font-weight: bold;
}

#contactList {
  overflow-y: auto;
  flex: 1;
}

.contact {
  padding: 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid #222;
  cursor: pointer;
}

.contact:hover,
.contact.selected {
  background: #242016;
}

.avatar {
  width: 43px;
  height: 43px;
  border-radius: 50%;
  background: #d4af37;
  color: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  flex-shrink: 0;
}

.contactInfo {
  flex: 1;
  min-width: 0;
}

.contactName {
  font-weight: bold;
  margin-bottom: 5px;
}

.contactStatus {
  font-size: 12px;
  color: #999;
}

.online {
  color: #35d875;
}

.offline {
  color: #888;
}

.empty {
  text-align: center;
  padding: 25px 15px;
  color: #888;
  font-size: 13px;
}

.chatArea {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  background: #080808;
}

.chatHeader {
  min-height: 67px;
  padding: 12px 18px;
  border-bottom: 1px solid #252525;
  display: flex;
  align-items: center;
  gap: 12px;
  background: #111;
}

.chatHeaderName {
  font-weight: bold;
}

.chatHeaderStatus {
  font-size: 12px;
  color: #999;
  margin-top: 4px;
}

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 18px;
}

.message {
  max-width: 75%;
  width: fit-content;
  background: #202020;
  border: 1px solid #333;
  padding: 11px 13px;
  border-radius: 12px;
  margin-bottom: 12px;
  overflow-wrap: anywhere;
}

.message.mine {
  background: #42371b;
  border-color: #a98b32;
  margin-left: auto;
}

.sender {
  color: #d4af37;
  font-weight: bold;
  font-size: 12px;
  margin-bottom: 6px;
}

.time {
  color: #aaa;
  font-size: 10px;
  margin-top: 7px;
  text-align: right;
}

#messageForm {
  display: flex;
  gap: 9px;
  padding: 13px;
  background: #111;
  border-top: 1px solid #292929;
}

#messageInput {
  flex: 1;
  min-width: 0;
  padding: 13px;
  border-radius: 22px;
  border: 1px solid #444;
  background: #222;
  color: white;
  outline: none;
}

#sendBtn {
  background: #d4af37;
  color: #000;
  border: 0;
  border-radius: 22px;
  padding: 0 20px;
  font-weight: bold;
}

#sendBtn:disabled {
  opacity: .5;
}

#backBtn {
  display: none;
  background: transparent;
  color: #d4af37;
  border: 0;
  font-size: 22px;
}

@media(max-width:700px) {

  .sidebar {
    width: 100%;
  }

  .chatArea {
    display: none;
    width: 100%;
  }

  .layout.showChat .sidebar {
    display: none;
  }

  .layout.showChat .chatArea {
    display: flex;
  }

  #backBtn {
    display: block;
  }

  .message {
    max-width: 88%;
  }

  header {
    padding: 0 12px;
  }

  .logo {
    font-size: 18px;
  }

}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">⚡ TERZEX CHAT</div>
  <button id="logoutBtn">Logout</button>
</header>

<div id="status">Connecting to Terzex...</div>

<div class="layout" id="layout">

  <aside class="sidebar">

    <div class="sidebarTitle">Messages</div>

    <div class="search">
      <input
        id="searchInput"
        placeholder="Search people..."
      >
    </div>

    <div class="tabs">
      <button id="allTab" class="active">Chats</button>
      <button id="usersTab">Contacts</button>
      <button id="publicTab">Public</button>
    </div>

    <div id="contactList">
      <div class="empty">Loading contacts...</div>
    </div>

  </aside>

  <main class="chatArea">

    <div class="chatHeader">

      <button id="backBtn">‹</button>

      <div class="avatar" id="chatAvatar">T</div>

      <div>
        <div class="chatHeaderName" id="chatName">
          Welcome to Terzex Chat
        </div>

        <div class="chatHeaderStatus" id="chatStatus">
          Select a conversation
        </div>
      </div>

    </div>

    <div id="messages">
      <div class="empty">
        Select a person to start chatting.
      </div>
    </div>

    <form id="messageForm">

      <input
        id="messageInput"
        placeholder="Write a message..."
        maxlength="2000"
        autocomplete="off"
        required
      >

      <button id="sendBtn">Send</button>

    </form>

  </main>

</div>
</div>

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut
} from
"https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  query,
  where,
  orderBy,
  limit,
  onSnapshot,
  serverTimestamp,
  doc,
  setDoc
} from
"https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";


// FIREBASE CONFIGURATION

const firebaseConfig = {
  apiKey: "AIzaSyD9EIBvB_1wlUCa2f4XzxjHvulEoELjJ6o",
  authDomain: "terzex-chat.firebaseapp.com",
  projectId: "terzex-chat",
  storageBucket: "terzex-chat.firebasestorage.app",
  messagingSenderId: "439554401022",
  appId: "1:439554401022:web:2eddf4bebb81fab30ffbaf",
  measurementId: "G-9BQYK88HN9"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);


// APP VARIABLES

let currentUser = null;
let activeChatId = null;
let activeOtherUser = null;
let currentMode = "users";

let unsubscribeMessages = null;
let unsubscribeContacts = null;
let heartbeatTimer = null;

const layout = document.getElementById("layout");
const contactList = document.getElementById("contactList");
const messages = document.getElementById("messages");

const chatName = document.getElementById("chatName");
const chatStatus = document.getElementById("chatStatus");
const chatAvatar = document.getElementById("chatAvatar");

const messageInput = document.getElementById("messageInput");
const messageForm = document.getElementById("messageForm");
const sendBtn = document.getElementById("sendBtn");

const status = document.getElementById("status");


// HELPERS

function displayName(user) {
  return user.displayName ||
    user.name ||
    (user.email ? user.email.split("@")[0] : "Terzex User");
}

function initials(name) {
  return (name || "T").charAt(0).toUpperCase();
}

function showMessage(data) {

  const box = document.createElement("div");

  box.className =
    "message" +
    (data.senderId === currentUser.uid ? " mine" : "");

  const sender = document.createElement("div");
  sender.className = "sender";
  sender.textContent = data.senderName || "Terzex User";

  const text = document.createElement("div");
  text.textContent = data.text || "";

  const time = document.createElement("div");
  time.className = "time";

  if (data.createdAt?.toDate) {
    time.textContent =
      data.createdAt.toDate().toLocaleString();
  }

  box.append(sender, text, time);
  messages.appendChild(box);
}

function stopMessageListener() {

  if (unsubscribeMessages) {
    unsubscribeMessages();
    unsubscribeMessages = null;
  }

}


// PRESENCE

async function updatePresence(isOnline) {

  if (!currentUser) return;

  try {

    await setDoc(
      doc(db, "users", currentUser.uid),
      {
        uid: currentUser.uid,
        name: displayName(currentUser),
        online: isOnline,
        lastSeen: serverTimestamp(),
        updatedAt: serverTimestamp()
      },
      { merge: true }
    );

  } catch (error) {

    console.error("Presence error:", error);

  }

}

function startPresence() {

  updatePresence(true);

  heartbeatTimer = setInterval(() => {

    if (document.visibilityState === "visible") {
      updatePresence(true);
    }

  }, 60000);

}

document.addEventListener("visibilitychange", () => {

  if (!currentUser) return;

  if (document.visibilityState === "visible") {
    updatePresence(true);
  } else {
    updatePresence(false);
  }

});

window.addEventListener("pagehide", () => {

  if (currentUser) {
    updatePresence(false);
  }

});


// AUTHENTICATION

onAuthStateChanged(auth, async user => {

  if (!user) {
    window.location.href = "/";
    return;
  }

  currentUser = user;

  status.textContent =
    "Welcome to Terzex Chat, " + displayName(user);

  try {

    await setDoc(
      doc(db, "users", user.uid),
      {
        uid: user.uid,
        name: displayName(user),
        online: true,
        lastSeen: serverTimestamp(),
        updatedAt: serverTimestamp()
      },
      { merge: true }
    );

    startPresence();
    loadContacts();

  } catch (error) {

    console.error(error);

    status.textContent =
      "Could not update profile. Check Firebase rules.";

  }

});


// LOAD CONTACTS

function loadContacts() {

  if (unsubscribeContacts) {
    unsubscribeContacts();
  }

  unsubscribeContacts = onSnapshot(
    collection(db, "users"),
    snapshot => {

      const people = [];

      snapshot.forEach(item => {

        const person = item.data();

        if (
          person.uid &&
          person.uid !== currentUser.uid
        ) {
          people.push(person);
        }

      });

      renderContacts(people);

    },
    error => {

      console.error(error);

      contactList.innerHTML =
        '<div class="empty">Could not load contacts.</div>';

    }
  );

}

function renderContacts(people) {

  const search =
    document.getElementById("searchInput")
    .value.toLowerCase();

  const filtered = people.filter(person => {

    return displayName(person)
      .toLowerCase()
      .includes(search);

  });

  contactList.innerHTML = "";

  if (!filtered.length) {

    contactList.innerHTML =
      '<div class="empty">No other Terzex users found.</div>';

    return;

  }

  filtered.sort((a, b) => {

    return Number(b.online === true) -
      Number(a.online === true);

  });

  filtered.forEach(person => {

    const row = document.createElement("div");

    row.className = "contact";

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = initials(displayName(person));

    const info = document.createElement("div");
    info.className = "contactInfo";

    const name = document.createElement("div");
    name.className = "contactName";
    name.textContent = displayName(person);

    const presence = document.createElement("div");
    presence.className = "contactStatus";

    if (person.online === true) {

      presence.classList.add("online");
      presence.textContent = "● Online";

    } else {

      presence.classList.add("offline");
      presence.textContent = "○ Offline";

    }

    info.append(name, presence);
    row.append(avatar, info);

    row.addEventListener("click", () => {
      openPrivateChat(person);
    });

    contactList.appendChild(row);

  });

}


// SEARCH

document.getElementById("searchInput")
.addEventListener("input", loadSearchResults);

function loadSearchResults() {

  if (unsubscribeContacts) {
    // The live listener will redraw the filtered list.
  }

  getDocs(collection(db, "users"))
    .then(snapshot => {

      const people = [];

      snapshot.forEach(item => {

        const person = item.data();

        if (
          person.uid &&
          person.uid !== currentUser?.uid
        ) {
          people.push(person);
        }

      });

      renderContacts(people);

    })
    .catch(console.error);

}


// OPEN PRIVATE CHAT

async function openPrivateChat(person) {

  if (!currentUser || !person.uid) return;

  stopMessageListener();

  activeOtherUser = person;
  activeChatId = null;
  currentMode = "private";

  chatName.textContent = displayName(person);

  chatAvatar.textContent =
    initials(displayName(person));

  chatStatus.textContent =
    person.online ? "● Online" : "○ Offline";

  layout.classList.add("showChat");

  messages.innerHTML =
    '<div class="empty">Opening conversation...</div>';

  try {

    const q = query(
      collection(db, "private_chats"),
      where("participants", "array-contains", currentUser.uid)
    );

    const snapshot = await getDocs(q);

    let found = null;

    snapshot.forEach(item => {

      const data = item.data();

      if (
        Array.isArray(data.participants) &&
        data.participants.includes(person.uid) &&
        data.participants.length === 2
      ) {
        found = item.id;
      }

    });

    if (found) {

      activeChatId = found;

    } else {

      const created = await addDoc(
        collection(db, "private_chats"),
        {
          participants: [
            currentUser.uid,
            person.uid
          ],
          createdAt: serverTimestamp()
        }
      );

      activeChatId = created.id;

    }

    loadPrivateMessages();

  } catch (error) {

    console.error(error);

    messages.innerHTML =
      '<div class="empty">Could not open conversation. Check Firebase rules.</div>';

  }

}


// LOAD PRIVATE MESSAGES

function loadPrivateMessages() {

  stopMessageListener();

  const q = query(
    collection(
      db,
      "private_chats",
      activeChatId,
      "messages"
    ),
    orderBy("createdAt", "asc")
  );

  unsubscribeMessages = onSnapshot(
    q,
    snapshot => {

      messages.innerHTML = "";

      if (snapshot.empty) {

        messages.innerHTML =
          '<div class="empty">Start your conversation!</div>';

        return;

      }

      snapshot.forEach(item => {
        showMessage(item.data());
      });

      messages.scrollTop = messages.scrollHeight;

    },
    error => {

      console.error(error);

      messages.innerHTML =
        '<div class="empty">Could not load messages.</div>';

    }
  );

}


// PUBLIC CHAT

function openPublicChat() {

  stopMessageListener();

  activeChatId = null;
  activeOtherUser = null;
  currentMode = "public";

  chatName.textContent = "Terzex Public Chat";
  chatAvatar.textContent = "⚡";
  chatStatus.textContent = "Public conversation";

  layout.classList.add("showChat");

  messages.innerHTML =
    '<div class="empty">Loading public messages...</div>';

  const q = query(
    collection(db, "messages"),
    orderBy("createdAt", "asc"),
    limit(100)
  );

  unsubscribeMessages = onSnapshot(
    q,
    snapshot => {

      messages.innerHTML = "";

      snapshot.forEach(item => {
        showMessage(item.data());
      });

      messages.scrollTop = messages.scrollHeight;

    },
    error => {

      console.error(error);

      messages.innerHTML =
        '<div class="empty">Could not load public messages.</div>';

    }
  );

}


// SEND MESSAGE

messageForm.addEventListener("submit", async event => {

  event.preventDefault();

  const text = messageInput.value.trim();

  if (!text || !currentUser) return;

  sendBtn.disabled = true;

  try {

    if (currentMode === "private" && activeChatId) {

      await addDoc(
        collection(
          db,
          "private_chats",
          activeChatId,
          "messages"
        ),
        {
          text,
          senderId: currentUser.uid,
          senderName: displayName(currentUser),
          createdAt: serverTimestamp()
        }
      );

    } else if (currentMode === "public") {

      await addDoc(
        collection(db, "messages"),
        {
          text,
          senderId: currentUser.uid,
          senderName: displayName(currentUser),
          createdAt: serverTimestamp()
        }
      );

    } else {

      alert("Please select a conversation first.");
      return;

    }

    messageInput.value = "";

  } catch (error) {

    console.error(error);

    alert("Message could not be sent.");

  } finally {

    sendBtn.disabled = false;

  }

});


// NAVIGATION

document.getElementById("publicTab")
.addEventListener("click", () => {

  openPublicChat();

});

document.getElementById("usersTab")
.addEventListener("click", () => {

  loadSearchResults();

});

document.getElementById("allTab")
.addEventListener("click", () => {

  loadSearchResults();

});

document.getElementById("backBtn")
.addEventListener("click", () => {

  stopMessageListener();
  layout.classList.remove("showChat");

});


// LOGOUT

document.getElementById("logoutBtn")
.addEventListener("click", async () => {

  await updatePresence(false);

  if (heartbeatTimer) {
    clearInterval(heartbeatTimer);
  }

  if (unsubscribeContacts) {
    unsubscribeContacts();
  }

  stopMessageListener();

  try {

    await signOut(auth);
    window.location.href = "/";

  } catch (error) {

    console.error(error);
    alert("Logout failed.");

  }

});

</script>

</body>
</html>
