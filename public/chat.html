<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050505">
<title>Terzex Chat</title>
<style>
*{box-sizing:border-box}
:root{--gold:#d4af37;--bg:#050505;--panel:#111;--border:#292929}
body{margin:0;background:var(--bg);color:white;font-family:Arial,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
header{height:62px;background:#090909;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.logo{font-size:20px;font-weight:bold;color:var(--gold)}
header button,.icon{background:none;border:0;color:var(--gold);font-size:20px}
.app{height:calc(100vh - 120px);display:flex}
.sidebar{width:320px;background:#0b0b0b;border-right:1px solid var(--border);display:flex;flex-direction:column}
.search{margin:14px;padding:12px;border-radius:25px;background:#1b1b1b;color:white;border:1px solid #333;outline:none}
.tabs{display:flex;border-bottom:1px solid var(--border)}
.tabs button{flex:1;background:none;border:0;color:#aaa;padding:13px 3px;font-size:12px}
.tabs button.active{color:var(--gold);border-bottom:2px solid var(--gold)}
#people{overflow:auto;flex:1}
.person{display:flex;align-items:center;gap:12px;padding:13px;border-bottom:1px solid #1b1b1b;cursor:pointer}
.person:hover{background:#191919}
.avatar{width:44px;height:44px;border-radius:50%;background:#292929;color:var(--gold);display:grid;place-items:center;font-weight:bold;flex-shrink:0;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.person-info{min-width:0}
.person-info strong,.person-info small{display:block;overflow:hidden;text-overflow:ellipsis}
.person-info small{color:#999;margin-top:5px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.welcome{margin:auto;text-align:center;color:#aaa}
.welcome .bolt{font-size:60px;color:var(--gold)}
.welcome h2{color:var(--gold)}
#chat{display:none;flex:1;min-height:0;flex-direction:column}
.chat-head{height:65px;display:flex;align-items:center;gap:12px;padding:10px;border-bottom:1px solid var(--border)}
.chat-head-info{flex:1}
.chat-head-info strong,.chat-head-info small{display:block}
.chat-head-info small{color:#999;margin-top:4px}
#messages{flex:1;overflow:auto;padding:15px;display:flex;flex-direction:column;gap:10px}
.bubble{max-width:78%;padding:11px 13px;border-radius:13px;background:#202020;overflow-wrap:anywhere}
.bubble.mine{align-self:flex-end;background:#493b12;border:1px solid #80691e}
.bubble small{display:block;color:#bbb;font-size:10px;margin-top:7px;text-align:right}
.bubble-actions{display:flex;gap:8px;margin-top:7px}
.bubble-actions button{font-size:11px;background:none;border:0;color:#d4af37;padding:2px}
#replyBox{display:none;background:#1a1a1a;border-left:3px solid var(--gold);padding:9px;color:#ddd}
.composer{display:flex;align-items:center;gap:7px;padding:10px;border-top:1px solid var(--border)}
.composer input{flex:1;min-width:0;padding:13px;border-radius:25px;background:#191919;border:1px solid #333;color:white;outline:none}
.send{background:var(--gold);color:black;border:0;border-radius:22px;padding:12px 17px;font-weight:bold}
#emojiPanel{display:none;padding:10px;background:#151515;flex-wrap:wrap;gap:8px}
#emojiPanel button{background:#222;border:0;border-radius:7px;padding:7px;font-size:20px}
.bottom{height:58px;background:#090909;border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:center}
.bottom button{background:none;border:0;color:#aaa;font-size:12px}
.bottom button span{display:block;font-size:19px;margin-bottom:3px}
.bottom button.active{color:var(--gold)}
.empty{padding:25px;text-align:center;color:#888}
@media(max-width:700px){
 .sidebar{width:100%}
 .main{display:none}
 .app.open .sidebar{display:none}
 .app.open .main{display:flex}
 .bubble{max-width:88%}
}
</style>
</head>
<body>

<header>
 <div class="logo">⚡ TERZEX CHAT</div>
 <div>
  <button id="notificationButton">🔔</button>
  <button id="logoutButton">↪</button>
 </div>
</header>

<div class="app" id="app">
 <aside class="sidebar">
  <input id="search" class="search" placeholder="Search people...">
  <nav class="tabs">
   <button class="active">Chats</button>
   <button id="contactsTab">Contacts</button>
  </nav>
  <div id="people"><div class="empty">Loading contacts...</div></div>
 </aside>

 <main class="main">
  <section class="welcome" id="welcome">
   <div class="bolt">⚡</div>
   <h2>Welcome to Terzex Chat</h2>
   <p>Select a contact to start a private conversation.</p>
  </section>

  <section id="chat">
   <div class="chat-head">
    <button class="icon" id="back">←</button>
    <div class="avatar" id="chatAvatar">T</div>
    <div class="chat-head-info">
     <strong id="chatName">Chat</strong>
     <small id="chatStatus">Connecting...</small>
    </div>
    <button class="icon" id="chatMenu">⋮</button>
   </div>

   <div id="messages"></div>
   <div id="replyBox">
    <span id="replyText"></span>
    <button class="icon" id="cancelReply">✕</button>
   </div>

   <div id="emojiPanel">
    <button>😀</button><button>😂</button><button>😍</button>
    <button>🥰</button><button>😘</button><button>❤️</button>
    <button>🔥</button><button>👍</button><button>🙏</button>
    <button>😭</button><button>🎉</button><button>👏</button>
    <button>🤔</button><button>😊</button><button>💯</button>
   </div>

   <form class="composer" id="messageForm">
    <button type="button" class="icon" id="emojiButton">😊</button>
    <input id="messageInput" placeholder="Write a message..." autocomplete="off">
    <button class="send" type="submit">Send</button>
   </form>
  </section>
 </main>
</div>

<nav class="bottom">
 <button class="active"><span>💬</span>Chats</button>
 <button><span>📞</span>Calls</button>
 <button><span>👥</span>Communities</button>
 <button><span>◉</span>Status</button>
 <button><span>⚙️</span>Settings</button>
</nav>

<script type="module">
import {initializeApp}
 from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";

import {
 getAuth,onAuthStateChanged,signOut
} from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

import {
 getFirestore,collection,doc,getDoc,getDocs,setDoc,
 addDoc,query,where,onSnapshot,serverTimestamp,
 updateDoc,deleteDoc
} from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

/* YOUR EXISTING FIREBASE PROJECT */
const firebaseConfig={
 apiKey:"AIzaSyD9EIBvB_1wlUCa2f4XzxjHvulEoELjJ6o",
 authDomain:"terzex-chat.firebaseapp.com",
 projectId:"terzex-chat",
 storageBucket:"terzex-chat.firebasestorage.app",
 messagingSenderId:"439554401022",
 appId:"1:439554401022:web:2eddf4bebb81fab30ffbaf",
 measurementId:"G-9BQYK88HN9"
};

const appFirebase=initializeApp(firebaseConfig);
const auth=getAuth(appFirebase);
const db=getFirestore(appFirebase);

const $=id=>document.getElementById(id);

let me=null;
let myProfile={};
let contacts=[];
let activePerson=null;
let activeChatId=null;
let stopMessages=null;
let stopContacts=null;
let replyMessage=null;

function displayName(person){
 return person.name||person.username||person.email||"Terzex User";
}

function showError(error){
 console.error(error);
 alert(error.message||"Something went wrong.");
}

function makeAvatar(person){
 const avatar=document.createElement("div");
 avatar.className="avatar";

 if(person.photoURL){
  const img=document.createElement("img");
  img.src=person.photoURL;
  img.onerror=()=>avatar.textContent="T";
  avatar.appendChild(img);
 }else{
  avatar.textContent=displayName(person).charAt(0).toUpperCase();
 }
 return avatar;
}

function timestamp(value){
 if(!value)return "";
 const date=value.toDate?value.toDate():new Date(value);
 return date.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
}

/* LOAD MY ACCOUNT */

async function loadMyProfile(){
 const ref=doc(db,"users",me.uid);
 const snap=await getDoc(ref);

 if(snap.exists()){
  myProfile=snap.data();
 }else{
  myProfile={
   name:me.displayName||me.email||"Terzex User",
   email:me.email||"",
   online:true
  };
  await setDoc(ref,myProfile,{merge:true});
 }
}

/* LOAD CONTACTS */

function loadContacts(){
 if(stopContacts)stopContacts();

 stopContacts=onSnapshot(collection(db,"users"),snapshot=>{
  contacts=[];

  snapshot.forEach(item=>{
   if(item.id!==me.uid){
    contacts.push({id:item.id,...item.data()});
   }
  });

  renderContacts();
 },showError);
}

function renderContacts(){
 const list=$("people");
 const search=$("search").value.toLowerCase();

 list.innerHTML="";

 const filtered=contacts.filter(person=>
  displayName(person).toLowerCase().includes(search)||
  (person.email||"").toLowerCase().includes(search)||
  (person.username||"").toLowerCase().includes(search)
 );

 if(!filtered.length){
  list.innerHTML='<div class="empty">No contacts found.</div>';
  return;
 }

 filtered.forEach(person=>{
  const row=document.createElement("div");
  row.className="person";
  row.appendChild(makeAvatar(person));

  const info=document.createElement("div");
  info.className="person-info";

  const name=document.createElement("strong");
  name.textContent=displayName(person);

  const status=document.createElement("small");
  status.textContent=person.online?"🟢 Online":"Offline";

  info.append(name,status);
  row.appendChild(info);
  row.onclick=()=>openPrivateChat(person);

  list.appendChild(row);
 });
}

$("search").addEventListener("input",renderContacts);

/* OPEN OR CREATE PRIVATE CHAT */

async function openPrivateChat(person){
 try{
  $("welcome").style.display="none";
  $("chat").style.display="flex";
  $("app").classList.add("open");

  activePerson=person;
  $("chatName").textContent=displayName(person);
  $("chatStatus").textContent=person.online?"Online":"Offline";

  const avatar=$("chatAvatar");
  avatar.innerHTML="";
  if(person.photoURL){
   const img=document.createElement("img");
   img.src=person.photoURL;
   avatar.appendChild(img);
  }else{
   avatar.textContent=displayName(person).charAt(0).toUpperCase();
  }

  const chats=await getDocs(query(
   collection(db,"private_chats"),
   where("participants","array-contains",me.uid)
  ));

  let found=null;

  chats.forEach(item=>{
   const participants=item.data().participants||[];
   if(participants.includes(person.id)&&participants.includes(me.uid)){
    found=item.id;
   }
  });

  if(!found){
   const created=await addDoc(collection(db,"private_chats"),{
    participants:[me.uid,person.id],
    createdAt:serverTimestamp()
   });
   found=created.id;
  }

  activeChatId=found;
  listenForMessages();

 }catch(error){
  showError(error);
 }
}

/* REAL-TIME MESSAGE LISTENER */

function listenForMessages(){
 if(stopMessages)stopMessages();

 const messageRef=collection(
  db,"private_chats",activeChatId,"messages"
 );

 $("messages").innerHTML=
  '<div class="empty">Loading messages...</div>';

 stopMessages=onSnapshot(messageRef,snapshot=>{
  const messages=[];

  snapshot.forEach(item=>{
   messages.push({id:item.id,...item.data()});
  });

  messages.sort((a,b)=>
   (a.createdAt?.toMillis?.()||0)-
   (b.createdAt?.toMillis?.()||0)
  );

  $("messages").innerHTML="";

  if(!messages.length){
   $("messages").innerHTML=
    '<div class="empty">No messages yet. Say hello! 👋</div>';
  }

  messages.forEach(showMessage);

  $("messages").scrollTop=$("messages").scrollHeight;
 },error=>{
  console.error("Message listener error:",error);
  $("messages").innerHTML=
   '<div class="empty">Could not load messages. Check your Firestore rules and connection.</div>';
 });
}

/* DISPLAY MESSAGE */

function showMessage(message){
 const bubble=document.createElement("div");
 bubble.className="bubble";

 const mine=message.senderId===me.uid;
 if(mine)bubble.classList.add("mine");

 if(message.replyTo){
  const quoted=document.createElement("small");
  quoted.textContent="↪ "+message.replyTo;
  bubble.appendChild(quoted);
 }

 const text=document.createElement("div");
 text.textContent=message.text||"";
 bubble.appendChild(text);

 const time=document.createElement("small");
 time.textContent=timestamp(message.createdAt)+
  (message.edited?" · edited":"");
 bubble.appendChild(time);

 const actions=document.createElement("div");
 actions.className="bubble-actions";

 const reply=document.createElement("button");
 reply.textContent="↩ Reply";
 reply.onclick=()=>{
  replyMessage=message;
  $("replyText").textContent="Replying to: "+message.text;
  $("replyBox").style.display="block";
  $("messageInput").focus();
 };
 actions.appendChild(reply);

 if(mine){
  const edit=document.createElement("button");
  edit.textContent="✏️ Edit";
  edit.onclick=()=>editMessage(message);

  const remove=document.createElement("button");
  remove.textContent="🗑 Delete";
  remove.onclick=()=>removeMessage(message);

  actions.append(edit,remove);
 }

 bubble.appendChild(actions);

 $("messages").appendChild(bubble);
}

/* SEND MESSAGE */

$("messageForm").addEventListener("submit",async event=>{
 event.preventDefault();

 const text=$("messageInput").value.trim();

 if(!text||!activeChatId)return;

 const message={
  text,
  senderId:me.uid,
  senderName:displayName(myProfile),
  createdAt:serverTimestamp()
 };

 if(replyMessage){
  message.replyTo=replyMessage.text||"Message";
  message.replyToId=replyMessage.id;
 }

 try{
  $("messageInput").disabled=true;

  await addDoc(
   collection(db,"private_chats",activeChatId,"messages"),
   message
  );

  $("messageInput").value="";
  replyMessage=null;
  $("replyBox").style.display="none";

 }catch(error){
  showError(error);
 }finally{
  $("messageInput").disabled=false;
  $("messageInput").focus();
 }
});

/* REPLY */

$("cancelReply").onclick=()=>{
 replyMessage=null;
 $("replyBox").style.display="none";
};

/* EDIT MESSAGE */

async function editMessage(message){
 const updated=prompt("Edit your message:",message.text||"");

 if(updated===null||!updated.trim())return;

 try{
  await updateDoc(
   doc(db,"private_chats",activeChatId,"messages",message.id),
   {
    text:updated.trim(),
    edited:true,
    editedAt:serverTimestamp()
   }
  );
 }catch(error){
  showError(error);
 }
}

/* DELETE MESSAGE */

async function removeMessage(message){
 if(!confirm("Delete this message?"))return;

 try{
  await deleteDoc(
   doc(db,"private_chats",activeChatId,"messages",message.id)
  );
 }catch(error){
  showError(error);
 }
}

/* EMOJI PICKER */

$("emojiButton").onclick=()=>{
 const panel=$("emojiPanel");
 panel.style.display=panel.style.display==="flex"?"none":"flex";
};

$("emojiPanel").querySelectorAll("button").forEach(button=>{
 button.onclick=()=>{
  $("messageInput").value+=button.textContent;
  $("messageInput").focus();
 };
});

/* BACK TO CONTACTS */

$("back").onclick=()=>{
 $("app").classList.remove("open");
 $("chat").style.display="none";
 $("welcome").style.display="block";

 if(stopMessages){
  stopMessages();
  stopMessages=null;
 }
 activeChatId=null;
 activePerson=null;
};

/* CHAT MENU */

$("chatMenu").onclick=()=>{
 alert("More Terzex private chat options are coming in the next update.");
};

/* LOGOUT */

$("logoutButton").onclick=async()=>{
 if(!confirm("Log out of Terzex Chat?"))return;

 if(stopMessages)stopMessages();
 if(stopContacts)stopContacts();

 await signOut(auth);
 window.location.href="index.html";
};

/* NOTIFICATIONS */

$("notificationButton").onclick=async()=>{
 if(!("Notification" in window)){
  alert("Notifications are not supported in this browser.");
  return;
 }

 const permission=await Notification.requestPermission();

 alert(permission==="granted"?
  "Notifications enabled.":
  "Notification permission was not granted.");
};

/* CONTACTS TAB */

$("contactsTab").onclick=()=>{
 $("search").focus();
};

/* AUTHENTICATION */

onAuthStateChanged(auth,async user=>{
 if(!user){
  window.location.href="index.html";
  return;
 }

 me=user;

 try{
  await loadMyProfile();
  loadContacts();
  console.log("Terzex private messaging connected.");
 }catch(error){
  showError(error);
 }
});
</script>
</body>
</html>
