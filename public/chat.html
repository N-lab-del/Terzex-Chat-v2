<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terzex Chat</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #080808;
      color: white;
    }

    header {
      background: #111;
      border-bottom: 1px solid #d4af37;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h2 {
      color: #d4af37;
      margin: 0;
    }

    button {
      background: #d4af37;
      color: black;
      border: none;
      padding: 11px 16px;
      border-radius: 7px;
      font-weight: bold;
      cursor: pointer;
    }

    #messages {
      height: calc(100vh - 145px);
      overflow-y: auto;
      padding: 15px;
    }

    .message {
      background: #191919;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
      max-width: 85%;
      overflow-wrap: anywhere;
    }

    .sender {
      color: #d4af37;
      font-size: 13px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    .message-text {
      font-size: 15px;
    }

    .time {
      color: #888;
      font-size: 11px;
      margin-top: 7px;
    }

    #input-area {
      position: fixed;
      bottom: 0;
      width: 100%;
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #111;
      border-top: 1px solid #333;
    }

    #messageInput {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #222;
      color: white;
      outline: none;
    }

    #status {
      color: #d4af37;
      text-align: center;
      padding: 8px;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <header>
    <h2>⚡ TERZEX CHAT</h2>
    <button id="logoutBtn">Logout</button>
  </header>

  <div id="status">Connecting...</div>

  <div id="messages"></div>

  <form id="input-area">
    <input
      type="text"
      id="messageInput"
      placeholder="Write a message..."
      maxlength="2000"
      autocomplete="off"
      required
    >

    <button type="submit" id="sendBtn">Send</button>
  </form>

  <script type="module">

    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from
      "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      addDoc,
      query,
      orderBy,
      limit,
      onSnapshot,
      serverTimestamp
    } from
      "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";


    // REPLACE THESE VALUES WITH YOUR REAL FIREBASE CONFIG

    const firebaseConfig = {
      apiKey: "AIzaSyD9EIBvB_1wlUCa2f4XzxjHvulEoELjJ6o",
  authDomain: "terzex-chat.firebaseapp.com",
  projectId: "terzex-chat",
  storageBucket: "terzex-chat.firebasestorage.app",
  messagingSenderId: "439554401022",
  appId: "1:439554401022:web:2eddf4bebb81fab30ffbaf",
  measurementId: "G-9BQYK88HN9"
    };


    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const messagesDiv = document.getElementById("messages");
    const messageInput = document.getElementById("messageInput");
    const inputForm = document.getElementById("input-area");
    const sendBtn = document.getElementById("sendBtn");
    const statusDiv = document.getElementById("status");
    const logoutBtn = document.getElementById("logoutBtn");

    let currentUser = null;
    let unsubscribeMessages = null;


    onAuthStateChanged(auth, (user) => {

      if (!user) {
        window.location.href = "/";
        return;
      }

      currentUser = user;

      statusDiv.textContent =
        "Welcome to Terzex Chat, " +
        (user.displayName || user.email);

      loadMessages();

    });


    function loadMessages() {

      const messagesQuery = query(
        collection(db, "messages"),
        orderBy("createdAt", "asc"),
        limit(100)
      );

      unsubscribeMessages = onSnapshot(
        messagesQuery,

        (snapshot) => {

          messagesDiv.innerHTML = "";

          snapshot.forEach((documentSnapshot) => {

            const message = documentSnapshot.data();

            const messageBox = document.createElement("div");
            messageBox.className = "message";

            const sender = document.createElement("div");
            sender.className = "sender";
            sender.textContent = message.senderName || "User";

            const text = document.createElement("div");
            text.className = "message-text";
            text.textContent = message.text || "";

            const time = document.createElement("div");
            time.className = "time";

            if (message.createdAt) {
              time.textContent =
                message.createdAt.toDate().toLocaleString();
            }

            messageBox.appendChild(sender);
            messageBox.appendChild(text);
            messageBox.appendChild(time);

            messagesDiv.appendChild(messageBox);

          });

          messagesDiv.scrollTop = messagesDiv.scrollHeight;

        },

        (error) => {
          console.error(error);
          statusDiv.textContent =
            "Could not load messages. Please check your connection.";
        }

      );

    }


    inputForm.addEventListener("submit", async (event) => {

      event.preventDefault();

      const text = messageInput.value.trim();

      if (!text || !currentUser) {
        return;
      }

      sendBtn.disabled = true;

      try {

        await addDoc(collection(db, "messages"), {

          text: text,

          senderId: currentUser.uid,

          senderName:
            currentUser.displayName ||
            currentUser.email,

          createdAt: serverTimestamp()

        });

        messageInput.value = "";

      } catch (error) {

        console.error(error);

        alert("Message could not be sent. Please try again.");

      } finally {

        sendBtn.disabled = false;

      }

    });


    logoutBtn.addEventListener("click", async () => {

      try {

        if (unsubscribeMessages) {
          unsubscribeMessages();
        }

        await signOut(auth);

        window.location.href = "/";

      } catch (error) {

        alert("Could not log out. Please try again.");

      }

    });

  </script>

</body>
</html>
