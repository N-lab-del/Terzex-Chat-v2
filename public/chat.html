<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>Terzex Chat</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080808;
  color: white;
  font-family: Arial, sans-serif;
}

button, input {
  font: inherit;
}

button {
  cursor: pointer;
}

.app {
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

header {
  height: 65px;
  background: #101010;
  border-bottom: 1px solid #302817;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  flex-shrink: 0;
}

.logo {
  color: #d4af37;
  font-size: 21px;
  font-weight: bold;
}

.headerRight {
  display: flex;
  align-items: center;
  gap: 12px;
}

#logoutBtn {
  background: #d4af37;
  color: #000;
  border: 0;
  padding: 9px 14px;
  border-radius: 20px;
  font-weight: bold;
}

#status {
  background: #111;
  color: #d4af37;
  padding: 6px 15px;
  font-size: 11px;
  flex-shrink: 0;
}

.layout {
  display: flex;
  flex: 1;
  min-height: 0;
}

.sidebar {
  width: 390px;
  max-width: 100%;
  background: #101010;
  border-right: 1px solid #292929;
  display: flex;
  flex-direction: column;
  min-height: 0;
  position: relative;
}

.sidebarTop {
  padding: 17px 15px 10px;
}

.sidebarTitle {
  color: #d4af37;
  font-size: 23px;
  font-weight: bold;
  margin-bottom: 15px;
}

.search {
  position: relative;
}

.search input {
  width: 100%;
  padding: 14px 18px 14px 43px;
  border-radius: 25px;
  border: 1px solid #333;
  background: #222;
  color: white;
  outline: none;
}

.searchIcon {
  position: absolute;
  left: 15px;
  top: 12px;
  color: #aaa;
  font-size: 19px;
}

#contactList {
  flex: 1;
  overflow-y: auto;
  padding-bottom: 10px;
}

.contact {
  padding: 13px 15px;
  display: flex;
  align-items: center;
  gap: 13px;
  border-bottom: 1px solid #1d1d1d;
  cursor: pointer;
}

.contact:hover,
.contact.selected {
  background: #211d12;
}

.avatar {
  width: 55px;
  height: 55px;
  border-radius: 50%;
  background: linear-gradient(135deg,#d4af37,#755b1d);
  color: #080808;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: 21px;
  flex-shrink: 0;
  position: relative;
}

.avatar.small {
  width: 43px;
  height: 43px;
  font-size: 16px;
}

.onlineDot {
  position: absolute;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #35d875;
  border: 2px solid #101010;
  right: 0;
  bottom: 1px;
}

.contactInfo {
  flex: 1;
  min-width: 0;
}

.contactTop {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

.contactName {
  font-weight: bold;
  font-size: 15px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.contactTime {
  color: #888;
  font-size: 11px;
  flex-shrink: 0;
}

.contactPreview {
  color: #999;
  font-size: 13px;
  margin-top: 7px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.contactStatus {
  font-size: 11px;
  margin-top: 5px;
}

.online {
  color: #35d875;
}

.offline {
  color: #888;
}

.empty {
  text-align: center;
  padding: 35px 15px;
  color: #888;
  font-size: 13px;
  line-height: 1.6;
}

.bottomNav {
  display: flex;
  justify-content: space-around;
  align-items: center;
  height: 76px;
  background: #111;
  border-top: 1px solid #302817;
  flex-shrink: 0;
  padding-bottom: env(safe-area-inset-bottom);
}

.navBtn {
  flex: 1;
  height: 100%;
  border: 0;
  background: transparent;
  color: #999;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 5px;
  font-size: 11px;
}

.navIcon {
  font-size: 23px;
}

.navBtn.active {
  color: #d4af37;
  font-weight: bold;
}

.navBtn.active .navIcon {
  transform: scale(1.08);
}

.floatingBtn {
  position: absolute;
  right: 20px;
  bottom: 93px;
  width: 58px;
  height: 58px;
  border-radius: 50%;
  border: 0;
  background: #d4af37;
  color: #080808;
  font-size: 29px;
  box-shadow: 0 4px 15px #000;
  z-index: 3;
}

.chatArea {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  background: #080808;
}

.chatHeader {
  min-height: 70px;
  padding: 12px 18px;
  border-bottom: 1px solid #252525;
  display: flex;
  align-items: center;
  gap: 12px;
  background: #111;
}

.chatHeaderName {
  font-weight: bold;
  font-size: 16px;
}

.chatHeaderStatus {
  font-size: 12px;
  color: #999;
  margin-top: 4px;
}

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 18px;
}

.message {
  max-width: 75%;
  width: fit-content;
  background: #202020;
  border: 1px solid #333;
  padding: 11px 13px;
  border-radius: 12px;
  margin-bottom: 12px;
  overflow-wrap: anywhere;
}

.message.mine {
  background: #42371b;
  border-color: #a98b32;
  margin-left: auto;
}

.sender {
  color: #d4af37;
  font-weight: bold;
  font-size: 12px;
  margin-bottom: 6px;
}

.time {
  color: #aaa;
  font-size: 10px;
  margin-top: 7px;
  text-align: right;
}

#messageForm {
  display: none;
  gap: 9px;
  padding: 13px;
  background: #111;
  border-top: 1px solid #292929;
}

#messageInput {
  flex: 1;
  min-width: 0;
  padding: 13px;
  border-radius: 22px;
  border: 1px solid #444;
  background: #222;
  color: white;
  outline: none;
}

#sendBtn {
  background: #d4af37;
  color: #000;
  border: 0;
  border-radius: 22px;
  padding: 0 20px;
  font-weight: bold;
}

#sendBtn:disabled {
  opacity: .5;
}

#backBtn {
  display: none;
  background: transparent;
  color: #d4af37;
  border: 0;
  font-size: 25px;
}

.pageContent {
  padding: 22px;
  overflow-y: auto;
}

.settingCard {
  background: #191919;
  border: 1px solid #333;
  border-radius: 13px;
  padding: 17px;
  margin-bottom: 12px;
}

.settingCard h3 {
  color: #d4af37;
  margin: 0 0 8px;
}

.settingCard p {
  color: #aaa;
  font-size: 13px;
  line-height: 1.5;
  margin: 0;
}

@media(max-width:700px) {

  header {
    padding: 0 13px;
  }

  .logo {
    font-size: 18px;
  }

  .sidebar {
    width: 100%;
    border-right: 0;
  }

  .chatArea {
    display: none;
    width: 100%;
  }

  .layout.showChat .sidebar {
    display: none;
  }

  .layout.showChat .chatArea {
    display: flex;
  }

  .layout.showChat ~ .bottomNav {
    display: none;
  }

  #backBtn {
    display: block;
  }

  .message {
    max-width: 88%;
  }

  .floatingBtn {
    bottom: 91px;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">⚡ TERZEX CHAT</div>
  <div class="headerRight">
    <button id="logoutBtn">Logout</button>
  </div>
</header>

<div id="status">Connecting to Terzex...</div>

<div class="layout" id="layout">

  <aside class="sidebar">

    <div class="sidebarTop">
      <div class="sidebarTitle" id="sidebarTitle">Chats</div>

      <div class="search">
        <span class="searchIcon">⌕</span>
        <input
          id="searchInput"
          placeholder="Search Chats"
          autocomplete="off"
        >
      </div>
    </div>

    <div id="contactList">
      <div class="empty">Loading Terzex...</div>
    </div>

    <button class="floatingBtn" id="newChatBtn">＋</button>

  </aside>

  <main class="chatArea">

    <div class="chatHeader">

      <button id="backBtn">‹</button>

      <div class="avatar" id="chatAvatar">T</div>

      <div>
        <div class="chatHeaderName" id="chatName">
          Welcome to Terzex Chat
        </div>

        <div class="chatHeaderStatus" id="chatStatus">
          Select a conversation
        </div>
      </div>

    </div>

    <div id="messages">
      <div class="empty">
        ⚡ Welcome to Terzex Chat.<br>
        Select a conversation to start messaging.
      </div>
    </div>

    <form id="messageForm">

      <input
        id="messageInput"
        placeholder="Write a message..."
        maxlength="2000"
        autocomplete="off"
        required
      >

      <button id="sendBtn">Send</button>

    </form>

  </main>

</div>

<nav class="bottomNav" id="bottomNav">

  <button class="navBtn active" data-page="chats">
    <span class="navIcon">▣</span>
    <span>Chats</span>
  </button>

  <button class="navBtn" data-page="contacts">
    <span class="navIcon">♙</span>
    <span>Contacts</span>
  </button>

  <button class="navBtn" data-page="settings">
    <span class="navIcon">⚙</span>
    <span>Settings</span>
  </button>

  <button class="navBtn" data-page="profile">
    <span class="navIcon">◉</span>
    <span>Profile</span>
  </button>

</nav>

</div>

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut
} from
"https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  query,
  where,
  orderBy,
  limit,
  onSnapshot,
  serverTimestamp,
  doc,
  setDoc
} from
"https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";


// FIREBASE CONFIGURATION

const firebaseConfig = {
  apiKey: "AIzaSyD9EIBvB_1wlUCa2f4XzxjHvulEoELjJ6o",
  authDomain: "terzex-chat.firebaseapp.com",
  projectId: "terzex-chat",
  storageBucket: "terzex-chat.firebasestorage.app",
  messagingSenderId: "439554401022",
  appId: "1:439554401022:web:2eddf4bebb81fab30ffbaf",
  measurementId: "G-9BQYK88HN9"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);


// VARIABLES

let currentUser = null;
let activeChatId = null;
let activeOtherUser = null;
let currentMode = null;
let currentPage = "chats";

let unsubscribeMessages = null;
let unsubscribeContacts = null;
let heartbeatTimer = null;
let allPeople = [];

const layout = document.getElementById("layout");
const contactList = document.getElementById("contactList");
const messages = document.getElementById("messages");

const chatName = document.getElementById("chatName");
const chatStatus = document.getElementById("chatStatus");
const chatAvatar = document.getElementById("chatAvatar");

const messageInput = document.getElementById("messageInput");
const messageForm = document.getElementById("messageForm");
const sendBtn = document.getElementById("sendBtn");

const status = document.getElementById("status");
const searchInput = document.getElementById("searchInput");
const sidebarTitle = document.getElementById("sidebarTitle");


// HELPERS

function displayName(user) {
  return user.displayName ||
    user.name ||
    (user.email ? user.email.split("@")[0] : "Terzex User");
}

function initials(name) {
  return (name || "T").charAt(0).toUpperCase();
}

function stopMessageListener() {
  if (unsubscribeMessages) {
    unsubscribeMessages();
    unsubscribeMessages = null;
  }
}

function clearChatScreen() {
  stopMessageListener();
  activeChatId = null;
  activeOtherUser = null;
  currentMode = null;
  messageForm.style.display = "none";
}

function showMessage(data) {

  const box = document.createElement("div");

  box.className =
    "message" +
    (data.senderId === currentUser.uid ? " mine" : "");

  const sender = document.createElement("div");
  sender.className = "sender";
  sender.textContent = data.senderName || "Terzex User";

  const text = document.createElement("div");
  text.textContent = data.text || "";

  const time = document.createElement("div");
  time.className = "time";

  if (data.createdAt?.toDate) {
    time.textContent =
      data.createdAt.toDate().toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
      });
  }

  box.append(sender, text, time);
  messages.appendChild(box);
}

function createContactRow(person, preview, clickAction) {

  const row = document.createElement("div");
  row.className = "contact";

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = initials(displayName(person));

  if (person.online === true) {
    const dot = document.createElement("span");
    dot.className = "onlineDot";
    avatar.appendChild(dot);
  }

  const info = document.createElement("div");
  info.className = "contactInfo";

  const top = document.createElement("div");
  top.className = "contactTop";

  const name = document.createElement("div");
  name.className = "contactName";
  name.textContent = displayName(person);

  const time = document.createElement("div");
  time.className = "contactTime";
  time.textContent = person.online ? "Online" : "";

  const previewText = document.createElement("div");
  previewText.className = "contactPreview";
  previewText.textContent = preview ||
    (person.online ? "Online" : "Tap to start chatting");

  top.append(name, time);
  info.append(top, previewText);
  row.append(avatar, info);

  row.addEventListener("click", clickAction);

  return row;
}


// PRESENCE

async function updatePresence(isOnline) {

  if (!currentUser) return;

  try {

    await setDoc(
      doc(db, "users", currentUser.uid),
      {
        uid: currentUser.uid,
        name: displayName(currentUser),
        online: isOnline,
        lastSeen: serverTimestamp(),
        updatedAt: serverTimestamp()
      },
      { merge: true }
    );

  } catch (error) {
    console.error("Presence error:", error);
  }

}

function startPresence() {

  updatePresence(true);

  heartbeatTimer = setInterval(() => {
    if (document.visibilityState === "visible") {
      updatePresence(true);
    }
  }, 60000);

}

document.addEventListener("visibilitychange", () => {

  if (!currentUser) return;

  updatePresence(
    document.visibilityState === "visible"
  );

});

window.addEventListener("pagehide", () => {
  if (currentUser) updatePresence(false);
});


// AUTHENTICATION

onAuthStateChanged(auth, async user => {

  if (!user) {
    window.location.href = "/";
    return;
  }

  currentUser = user;

  status.textContent =
    "Welcome to Terzex Chat, " + displayName(user);

  try {

    await setDoc(
      doc(db, "users", user.uid),
      {
        uid: user.uid,
        name: displayName(user),
        online: true,
        lastSeen: serverTimestamp(),
        updatedAt: serverTimestamp()
      },
      { merge: true }
    );

    startPresence();
    loadContacts();

  } catch (error) {

    console.error(error);

    status.textContent =
      "Could not update profile. Check Firebase rules.";

  }

});


// CONTACTS LISTENER

function loadContacts() {

  if (unsubscribeContacts) {
    unsubscribeContacts();
  }

  unsubscribeContacts = onSnapshot(
    collection(db, "users"),
    snapshot => {

      allPeople = [];

      snapshot.forEach(item => {

        const person = item.data();

        if (
          person.uid &&
          person.uid !== currentUser.uid
        ) {
          allPeople.push(person);
        }

      });

      if (currentPage === "contacts") {
        renderContacts();
      }

    },
    error => {

      console.error(error);

      contactList.innerHTML =
        '<div class="empty">Could not load contacts.</div>';

    }
  );

}


// CONTACTS PAGE

function renderContacts() {

  const search = searchInput.value.toLowerCase();

  let people = allPeople.filter(person =>
    displayName(person).toLowerCase().includes(search)
  );

  people.sort((a, b) =>
    Number(b.online === true) -
    Number(a.online === true)
  );

  contactList.innerHTML = "";

  if (!people.length) {

    contactList.innerHTML =
      '<div class="empty">No other Terzex users found.<br>Invite someone to join Terzex Chat!</div>';

    return;

  }

  people.forEach(person => {

    contactList.appendChild(
      createContactRow(
        person,
        person.online ? "● Online" : "○ Offline",
        () => openPrivateChat(person)
      )
    );

  });

}


// CHATS PAGE

async function loadChats() {

  contactList.innerHTML =
    '<div class="empty">Loading your conversations...</div>';

  const publicPerson = {
    name: "Terzex Public Chat",
    online: true
  };

  const publicRow = createContactRow(
    publicPerson,
    "⚡ Join the public conversation",
    openPublicChat
  );

  contactList.innerHTML = "";
  contactList.appendChild(publicRow);

  try {

    const q = query(
      collection(db, "private_chats"),
      where("participants", "array-contains", currentUser.uid)
    );

    const snapshot = await getDocs(q);

    const conversations = [];

    for (const item of snapshot.docs) {

      const data = item.data();

      const otherUid = data.participants?.find(
        uid => uid !== currentUser.uid
      );

      if (!otherUid) continue;

      const person = allPeople.find(
        p => p.uid === otherUid
      );

      if (!person) continue;

      let preview = "Tap to open conversation";
      let latestTime = 0;

      try {

        const messageQuery = query(
          collection(db, "private_chats", item.id, "messages"),
          orderBy("createdAt", "desc"),
          limit(1)
        );

        const messageSnapshot = await getDocs(messageQuery);

        if (!messageSnapshot.empty) {

          const latest = messageSnapshot.docs[0].data();

          preview =
            (latest.senderId === currentUser.uid ? "You: " : "") +
            (latest.text || "");

          latestTime =
            latest.createdAt?.toDate?.().getTime() || 0;

        }

      } catch (messageError) {
        console.error(messageError);
      }

      conversations.push({
        person,
        chatId: item.id,
        preview,
        latestTime
      });

    }

    conversations.sort((a, b) =>
      b.latestTime - a.latestTime
    );

    const search = searchInput.value.toLowerCase();

    conversations
      .filter(item =>
        displayName(item.person).toLowerCase().includes(search)
      )
      .forEach(item => {

        const row = createContactRow(
          item.person,
          item.preview,
          () => openPrivateChat(item.person)
        );

        contactList.appendChild(row);

      });

    if (conversations.length === 0) {

      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent =
        "No private conversations yet. Tap the + button to find people.";

      contactList.appendChild(empty);

    }

  } catch (error) {

    console.error("Chat list error:", error);

    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent =
      "Could not load conversations. You can still use Contacts.";

    contactList.appendChild(empty);

  }

}


// SETTINGS PAGE

function showSettings() {

  contactList.innerHTML = `
    <div class="pageContent">

      <div class="settingCard">
        <h3>⚡ Terzex Settings</h3>
        <p>Manage your Terzex Chat experience.</p>
      </div>

      <div class="settingCard">
        <h3>Appearance</h3>
        <p>Terzex black and gold theme is active.</p>
      </div>

      <div class="settingCard">
        <h3>Account Security</h3>
        <p>Your account uses Firebase Authentication.</p>
      </div>

      <div class="settingCard">
        <h3>Privacy</h3>
        <p>Your private conversations are available to their participants.</p>
      </div>

      <div class="settingCard">
        <h3>About Terzex</h3>
        <p>Terzex Chat — Connect with everyone.</p>
      </div>

    </div>
  `;

}


// PROFILE PAGE

function showProfile() {

  contactList.innerHTML = "";

  const content = document.createElement("div");
  content.className = "pageContent";

  const card = document.createElement("div");
  card.className = "settingCard";

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.style.width = "85px";
  avatar.style.height = "85px";
  avatar.style.margin = "0 auto 18px";
  avatar.style.fontSize = "32px";
  avatar.textContent = initials(displayName(currentUser));

  const name = document.createElement("h3");
  name.style.textAlign = "center";
  name.textContent = displayName(currentUser);

  const email = document.createElement("p");
  email.style.textAlign = "center";
  email.textContent = currentUser.email || "No email available";

  const account = document.createElement("p");
  account.style.textAlign = "center";
  account.style.marginTop = "12px";
  account.textContent = "Terzex Chat Account";

  card.append(avatar, name, email, account);
  content.appendChild(card);
  contactList.appendChild(content);

}


// PRIVATE CHAT

async function openPrivateChat(person) {

  if (!currentUser || !person.uid) return;

  clearChatScreen();

  activeOtherUser = person;
  currentMode = "private";

  chatName.textContent = displayName(person);
  chatAvatar.textContent = initials(displayName(person));

  chatStatus.textContent =
    person.online ? "● Online" : "○ Offline";

  layout.classList.add("showChat");
  messageForm.style.display = "flex";

  messages.innerHTML =
    '<div class="empty">Opening conversation...</div>';

  try {

    const q = query(
      collection(db, "private_chats"),
      where("participants", "array-contains", currentUser.uid)
    );

    const snapshot = await getDocs(q);

    let found = null;

    snapshot.forEach(item => {

      const data = item.data();

      if (
        Array.isArray(data.participants) &&
        data.participants.includes(person.uid) &&
        data.participants.length === 2
      ) {
        found = item.id;
      }

    });

    if (found) {

      activeChatId = found;

    } else {

      const created = await addDoc(
        collection(db, "private_chats"),
        {
          participants: [
            currentUser.uid,
            person.uid
          ],
          createdAt: serverTimestamp()
        }
      );

      activeChatId = created.id;

    }

    loadPrivateMessages();

  } catch (error) {

    console.error(error);

    messages.innerHTML =
      '<div class="empty">Could not open conversation. Check Firebase rules.</div>';

  }

}


// PRIVATE MESSAGES

function loadPrivateMessages() {

  stopMessageListener();

  const q = query(
    collection(
      db,
      "private_chats",
      activeChatId,
      "messages"
    ),
    orderBy("createdAt", "asc")
  );

  unsubscribeMessages = onSnapshot(
    q,
    snapshot => {

      messages.innerHTML = "";

      if (snapshot.empty) {

        messages.innerHTML =
          '<div class="empty">Start your conversation!</div>';

        return;

      }

      snapshot.forEach(item => {
        showMessage(item.data());
      });

      messages.scrollTop = messages.scrollHeight;

    },
    error => {

      console.error(error);

      messages.innerHTML =
        '<div class="empty">Could not load messages.</div>';

    }
  );

}


// PUBLIC CHAT

function openPublicChat() {

  clearChatScreen();

  currentMode = "public";

  chatName.textContent = "Terzex Public Chat";
  chatAvatar.textContent = "⚡";
  chatStatus.textContent = "Public conversation";

  layout.classList.add("showChat");
  messageForm.style.display = "flex";

  messages.innerHTML =
    '<div class="empty">Loading public messages...</div>';

  const q = query(
    collection(db, "messages"),
    orderBy("createdAt", "asc"),
    limit(100)
  );

  unsubscribeMessages = onSnapshot(
    q,
    snapshot => {

      messages.innerHTML = "";

      snapshot.forEach(item => {
        showMessage(item.data());
      });

      messages.scrollTop = messages.scrollHeight;

    },
    error => {

      console.error(error);

      messages.innerHTML =
        '<div class="empty">Could not load public messages.</div>';

    }
  );

}


// SEND MESSAGE

messageForm.addEventListener("submit", async event => {

  event.preventDefault();

  const text = messageInput.value.trim();

  if (!text || !currentUser) return;

  sendBtn.disabled = true;

  try {

    if (currentMode === "private" && activeChatId) {

      await addDoc(
        collection(
          db,
          "private_chats",
          activeChatId,
          "messages"
        ),
        {
          text,
          senderId: currentUser.uid,
          senderName: displayName(currentUser),
          createdAt: serverTimestamp()
        }
      );

    } else if (currentMode === "public") {

      await addDoc(
        collection(db, "messages"),
        {
          text,
          senderId: currentUser.uid,
          senderName: displayName(currentUser),
          createdAt: serverTimestamp()
        }
      );

    } else {

      alert("Please select a conversation first.");
      return;

    }

    messageInput.value = "";

  } catch (error) {

    console.error(error);
    alert("Message could not be sent.");

  } finally {

    sendBtn.disabled = false;

  }

});


// BOTTOM NAVIGATION

function changePage(page) {

  if (layout.classList.contains("showChat")) {
    layout.classList.remove("showChat");
    clearChatScreen();
  }

  currentPage = page;

  document.querySelectorAll(".navBtn").forEach(button => {
    button.classList.toggle(
      "active",
      button.dataset.page === page
    );
  });

  searchInput.value = "";

  if (page === "chats") {

    sidebarTitle.textContent = "Chats";
    searchInput.placeholder = "Search Chats";
    loadChats();

  }

  if (page === "contacts") {

    sidebarTitle.textContent = "Contacts";
    searchInput.placeholder = "Search Contacts";
    renderContacts();

  }

  if (page === "settings") {

    sidebarTitle.textContent = "Settings";
    searchInput.placeholder = "Settings";
    showSettings();

  }

  if (page === "profile") {

    sidebarTitle.textContent = "Profile";
    searchInput.placeholder = "Profile";
    showProfile();

  }

}

document.querySelectorAll(".navBtn").forEach(button => {

  button.addEventListener("click", () => {
    changePage(button.dataset.page);
  });

});


// SEARCH

searchInput.addEventListener("input", () => {

  if (currentPage === "contacts") {
    renderContacts();
  }

  if (currentPage === "chats") {
    loadChats();
  }

});


// NEW CHAT BUTTON

document.getElementById("newChatBtn")
.addEventListener("click", () => {
  changePage("contacts");
});


// BACK BUTTON

document.getElementById("backBtn")
.addEventListener("click", () => {

  layout.classList.remove("showChat");
  clearChatScreen();

});


// LOGOUT

document.getElementById("logoutBtn")
.addEventListener("click", async () => {

  await updatePresence(false);

  if (heartbeatTimer) {
    clearInterval(heartbeatTimer);
  }

  if (unsubscribeContacts) {
    unsubscribeContacts();
  }

  stopMessageListener();

  try {

    await signOut(auth);
    window.location.href = "/";

  } catch (error) {

    console.error(error);
    alert("Logout failed.");

  }

});

</script>

</body>
</html>
