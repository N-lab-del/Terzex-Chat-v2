<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terzex Chat</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #080808;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  background: #111;
  border-bottom: 1px solid #d4af37;
  padding: 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header h2 {
  color: #d4af37;
  margin: 0;
}

button {
  background: #d4af37;
  color: black;
  border: none;
  padding: 11px 15px;
  border-radius: 7px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
}

#status {
  color: #d4af37;
  text-align: center;
  padding: 10px;
  font-size: 13px;
}

nav {
  display: flex;
  gap: 8px;
  padding: 12px;
  background: #111;
}

nav button {
  flex: 1;
}

nav button.active {
  background: white;
}

.section {
  display: none;
}

.section.active {
  display: block;
}

#messages, #privateMessages {
  height: 48vh;
  overflow-y: auto;
  padding: 12px;
}

.message {
  background: #191919;
  border: 1px solid #333;
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 10px;
  overflow-wrap: anywhere;
}

.sender {
  color: #d4af37;
  font-weight: bold;
  margin-bottom: 6px;
}

.time {
  color: #888;
  font-size: 11px;
  margin-top: 7px;
}

form {
  display: flex;
  gap: 8px;
  padding: 12px;
  background: #111;
}

input {
  flex: 1;
  min-width: 0;
  padding: 13px;
  background: #222;
  color: white;
  border: 1px solid #444;
  border-radius: 8px;
}

h3 {
  color: #d4af37;
  padding: 10px;
  margin-bottom: 5px;
}

#users {
  padding: 10px;
}

.user {
  padding: 14px;
  margin-bottom: 8px;
  background: #191919;
  border: 1px solid #444;
  border-radius: 8px;
  cursor: pointer;
}

.user:hover {
  border-color: #d4af37;
}

#privateForm {
  display: none;
}

#privateForm.visible {
  display: flex;
}

#privateTitle {
  font-size: 15px;
}

.empty {
  color: #999;
  padding: 15px;
  text-align: center;
}
</style>
</head>

<body>

<header>
  <h2>⚡ TERZEX CHAT</h2>
  <button id="logoutBtn">Logout</button>
</header>

<div id="status">Connecting...</div>

<nav>
  <button id="publicTab" class="active">Public Chat</button>
  <button id="privateTab">Private Messages</button>
</nav>

<section id="publicSection" class="section active">

  <div id="messages"></div>

  <form id="publicForm">
    <input
      id="messageInput"
      placeholder="Write a public message..."
      maxlength="2000"
      required
    >
    <button id="publicSendBtn">Send</button>
  </form>

</section>

<section id="privateSection" class="section">

  <h3>Find people</h3>

  <div id="users">
    Loading users...
  </div>

  <h3 id="privateTitle">Select someone to chat with</h3>

  <div id="privateMessages">
    <div class="empty">Your private messages will appear here.</div>
  </div>

  <form id="privateForm">
    <input
      id="privateInput"
      placeholder="Write a private message..."
      maxlength="2000"
      required
    >
    <button id="privateSendBtn">Send</button>
  </form>

</section>

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut
} from
"https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  query,
  where,
  orderBy,
  limit,
  onSnapshot,
  serverTimestamp,
  doc,
  setDoc
} from
"https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";


// YOUR EXISTING FIREBASE CONFIGURATION

const firebaseConfig = {
  apiKey: "AIzaSyD9EIBvB_1wlUCa2f4XzxjHvulEoELjJ6o",
  authDomain: "terzex-chat.firebaseapp.com",
  projectId: "terzex-chat",
  storageBucket: "terzex-chat.firebasestorage.app",
  messagingSenderId: "439554401022",
  appId: "1:439554401022:web:2eddf4bebb81fab30ffbaf",
  measurementId: "G-9BQYK88HN9"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let activeChatId = null;

let unsubscribePublic = null;
let unsubscribePrivate = null;

const status = document.getElementById("status");
const messages = document.getElementById("messages");
const privateMessages = document.getElementById("privateMessages");
const usersDiv = document.getElementById("users");

const publicSection = document.getElementById("publicSection");
const privateSection = document.getElementById("privateSection");

const publicTab = document.getElementById("publicTab");
const privateTab = document.getElementById("privateTab");

const privateTitle = document.getElementById("privateTitle");
const privateForm = document.getElementById("privateForm");


// SWITCH TABS

publicTab.addEventListener("click", () => {

  publicSection.classList.add("active");
  privateSection.classList.remove("active");

  publicTab.classList.add("active");
  privateTab.classList.remove("active");

});

privateTab.addEventListener("click", () => {

  privateSection.classList.add("active");
  publicSection.classList.remove("active");

  privateTab.classList.add("active");
  publicTab.classList.remove("active");

  loadUsers();

});


// AUTHENTICATION

onAuthStateChanged(auth, async user => {

  if (!user) {

    window.location.href = "/";
    return;

  }

  currentUser = user;

  status.textContent =
    "Welcome to Terzex Chat, " +
    (user.displayName || user.email);

  try {

    const name =
      user.displayName ||
      user.email.split("@")[0];

    await setDoc(
      doc(db, "users", user.uid),
      {
        uid: user.uid,
        name: name,
        updatedAt: serverTimestamp()
      },
      { merge: true }
    );

    loadPublicMessages();

  } catch (error) {

    console.error("Profile error:", error);

    status.textContent =
      "Profile error. Please check your Firebase rules.";

  }

});


// PUBLIC CHAT

function loadPublicMessages() {

  if (unsubscribePublic) {
    unsubscribePublic();
  }

  const q = query(
    collection(db, "messages"),
    orderBy("createdAt", "asc"),
    limit(100)
  );

  unsubscribePublic = onSnapshot(q, snapshot => {

    messages.innerHTML = "";

    snapshot.forEach(item => {

      const data = item.data();

      const box = document.createElement("div");
      box.className = "message";

      const sender = document.createElement("div");
      sender.className = "sender";
      sender.textContent = data.senderName || "User";

      const text = document.createElement("div");
      text.textContent = data.text || "";

      const time = document.createElement("div");
      time.className = "time";

      if (data.createdAt) {
        time.textContent =
          data.createdAt.toDate().toLocaleString();
      }

      box.append(sender, text, time);
      messages.appendChild(box);

    });

    messages.scrollTop = messages.scrollHeight;

  }, error => {

    console.error(error);
    status.textContent = "Could not load public messages.";

  });

}


// SEND PUBLIC MESSAGE

document.getElementById("publicForm")
.addEventListener("submit", async event => {

  event.preventDefault();

  const input = document.getElementById("messageInput");
  const button = document.getElementById("publicSendBtn");
  const text = input.value.trim();

  if (!text || !currentUser) return;

  button.disabled = true;

  try {

    await addDoc(collection(db, "messages"), {

      text: text,

      senderId: currentUser.uid,

      senderName:
        currentUser.displayName ||
        currentUser.email,

      createdAt: serverTimestamp()

    });

    input.value = "";

  } catch (error) {

    console.error(error);
    alert("Could not send public message.");

  } finally {

    button.disabled = false;

  }

});


// FIND REGISTERED USERS

async function loadUsers() {

  if (!currentUser) return;

  usersDiv.textContent = "Loading users...";

  try {

    const snapshot =
      await getDocs(collection(db, "users"));

    usersDiv.innerHTML = "";

    snapshot.forEach(item => {

      const user = item.data();

      if (user.uid === currentUser.uid) return;

      const button = document.createElement("div");

      button.className = "user";

      button.textContent =
        "👤 " + (user.name || "Terzex User");

      button.addEventListener("click", () => {
        openPrivateChat(user);
      });

      usersDiv.appendChild(button);

    });

    if (!usersDiv.children.length) {

      usersDiv.innerHTML =
        '<div class="empty">No other users found yet.</div>';

    }

  } catch (error) {

    console.error(error);

    usersDiv.textContent =
      "Could not load users. Check Firestore rules.";

  }

}


// OPEN OR CREATE PRIVATE CHAT

async function openPrivateChat(otherUser) {

  if (!currentUser || !otherUser.uid) return;

  if (unsubscribePrivate) {
    unsubscribePrivate();
    unsubscribePrivate = null;
  }

  activeChatId = null;

  privateTitle.textContent =
    "Chat with " + (otherUser.name || "Terzex User");

  privateMessages.textContent = "Opening conversation...";

  privateForm.classList.add("visible");

  try {

    const q = query(
      collection(db, "private_chats"),
      where("participants", "array-contains", currentUser.uid)
    );

    const snapshot = await getDocs(q);

    let existingChat = null;

    snapshot.forEach(item => {

      const data = item.data();

      if (
        Array.isArray(data.participants) &&
        data.participants.length === 2 &&
        data.participants.includes(otherUser.uid)
      ) {

        existingChat = item.id;

      }

    });

    if (existingChat) {

      activeChatId = existingChat;

    } else {

      const newChat = await addDoc(
        collection(db, "private_chats"),
        {
          participants: [
            currentUser.uid,
            otherUser.uid
          ],
          createdAt: serverTimestamp()
        }
      );

      activeChatId = newChat.id;

    }

    loadPrivateMessages();

  } catch (error) {

    console.error(error);

    privateMessages.textContent =
      "Could not open conversation. Check your Firestore rules.";

  }

}


// LOAD PRIVATE MESSAGES

function loadPrivateMessages() {

  if (unsubscribePrivate) {
    unsubscribePrivate();
  }

  if (!activeChatId) return;

  const q = query(
    collection(
      db,
      "private_chats",
      activeChatId,
      "messages"
    ),
    orderBy("createdAt", "asc")
  );

  unsubscribePrivate = onSnapshot(q, snapshot => {

    privateMessages.innerHTML = "";

    snapshot.forEach(item => {

      const data = item.data();

      const box = document.createElement("div");
      box.className = "message";

      const sender = document.createElement("div");
      sender.className = "sender";
      sender.textContent = data.senderName || "User";

      const text = document.createElement("div");
      text.textContent = data.text || "";

      const time = document.createElement("div");
      time.className = "time";

      if (data.createdAt) {
        time.textContent =
          data.createdAt.toDate().toLocaleString();
      }

      box.append(sender, text, time);
      privateMessages.appendChild(box);

    });

    if (!snapshot.size) {

      privateMessages.innerHTML =
        '<div class="empty">Start your private conversation!</div>';

    }

    privateMessages.scrollTop =
      privateMessages.scrollHeight;

  }, error => {

    console.error(error);

    privateMessages.textContent =
      "Could not load private messages.";

  });

}


// SEND PRIVATE MESSAGE

privateForm.addEventListener("submit", async event => {

  event.preventDefault();

  const input = document.getElementById("privateInput");
  const button = document.getElementById("privateSendBtn");

  const text = input.value.trim();

  if (!text || !currentUser || !activeChatId) return;

  button.disabled = true;

  try {

    await addDoc(
      collection(
        db,
        "private_chats",
        activeChatId,
        "messages"
      ),
      {
        text: text,
        senderId: currentUser.uid,
        senderName:
          currentUser.displayName ||
          currentUser.email,
        createdAt: serverTimestamp()
      }
    );

    input.value = "";

  } catch (error) {

    console.error(error);
    alert("Could not send private message.");

  } finally {

    button.disabled = false;

  }

});


// LOGOUT

document.getElementById("logoutBtn")
.addEventListener("click", async () => {

  if (unsubscribePublic) unsubscribePublic();

  if (unsubscribePrivate) unsubscribePrivate();

  try {

    await signOut(auth);

    window.location.href = "/";

  } catch (error) {

    console.error(error);
    alert("Logout failed.");

  }

});

</script>

</body>
</html>
