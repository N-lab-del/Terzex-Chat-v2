<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terzex Chat</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #050505;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  width: 90%;
  max-width: 400px;
  padding: 30px;
  background: #151515;
  border: 1px solid #d4af37;
  border-radius: 20px;
  text-align: center;
}

.logo {
  font-size: 32px;
  color: #d4af37;
  font-weight: bold;
}

.subtitle {
  color: #aaa;
  margin-bottom: 25px;
}

input {
  width: 100%;
  padding: 15px;
  margin: 10px 0;
  background: #222;
  color: white;
  border: 1px solid #444;
  border-radius: 8px;
  font-size: 15px;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 12px;
  background: #d4af37;
  color: black;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  font-size: 15px;
  cursor: pointer;
}

button:hover {
  background: #f1cf55;
}

#message {
  color: #d4af37;
  margin-top: 15px;
  font-size: 14px;
}
</
