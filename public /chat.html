<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terzex Chat</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #050505;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      background: #111;
      border-bottom: 1px solid #d4af37;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h2 {
      color: #d4af37;
      margin: 0;
    }

    button {
      background: #d4af37;
      color: black;
      border: none;
      padding: 12px 18px;
      border-radius: 7px;
      font-weight: bold;
      cursor: pointer;
    }

    #welcome {
      padding: 15px;
      color: #d4af37;
    }

    #messages {
      height: 65vh;
      overflow-y: auto;
      padding: 15px;
    }

    .message {
      background: #181818;
      border: 1px solid #333;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 12px;
      overflow-wrap: anywhere;
    }

    .sender {
      color: #d4af37;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .text {
      white-space: pre-wrap;
    }

    form {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 12px;
      background: #111;
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 14px;
      background: #222;
      color: white;
      border: 1px solid #444;
      border-radius: 8px;
    }

    #status {
      color: #d4af37;
      padding: 10px 15px;
    }
  </style>
</head>

<body>

  <header>
    <h2>⚡ TERZEX CHAT</h2>
    <button id="logout">LOG OUT</button>
  </header>

  <div id="welcome">Connecting...</div>

  <div id="status"></div>

  <main id="messages"></main>

  <form id="messageForm">
    <input
      id="messageInput"
      type="text"
      placeholder="Write a message..."
      maxlength="2000"
      autocomplete="off"
      required
    >

    <button type="submit">SEND</button>
  </form>

  <script type="module">

    import { initializeApp }
    from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      addDoc,
      query,
      orderBy,
      limit,
      onSnapshot,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

    // FIREBASE CONFIGURATION
    // Replace these placeholders with your actual Firebase values.

    const firebaseConfig = {
      apiKey: "AIzaSyD9EIBvB_1wlUCa2f4XzxjHvulEoELjJ6o",
  authDomain: "terzex-chat.firebaseapp.com",
  projectId: "terzex-chat",
  storageBucket: "terzex-chat.firebasestorage.app",
  messagingSenderId: "439554401022",
  appId: "1:439554401022:web:2eddf4bebb81fab30ffbaf",
  measurementId: "G-9BQYK88HN9"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const messagesDiv = document.getElementById("messages");
    const statusDiv = document.getElementById("status");
    const welcomeDiv = document.getElementById("welcome");
    const messageInput = document.getElementById("messageInput");
    const messageForm = document.getElementById("messageForm");

    let currentUser = null;
    let unsubscribeMessages = null;

    // CHECK LOGIN
    onAuthStateChanged(auth, (user) => {

      if (!user) {
        window.location.href = "/";
        return;
      }

      currentUser = user;

      welcomeDiv.textContent =
        "Welcome, " + (user.displayName || user.email);

      loadMessages();
    });

    // LOAD MESSAGES
    function loadMessages() {

      const messagesQuery = query(
        collection(db, "messages"),
        orderBy("createdAt", "asc"),
        limit(100)
      );

      unsubscribeMessages = onSnapshot(
        messagesQuery,

        (snapshot) => {

          messagesDiv.innerHTML = "";

          snapshot.forEach((doc) => {

            const data = doc.data();

            const messageBox = document.createElement("div");
            messageBox.className = "message";

            const sender = document.createElement("div");
            sender.className = "sender";
            sender.textContent = data.senderName || "User";

            const text = document.createElement("div");
            text.className = "text";
            text.textContent = data.text || "";

            messageBox.appendChild(sender);
            messageBox.appendChild(text);

            messagesDiv.appendChild(messageBox);
          });

          messagesDiv.scrollTop = messagesDiv.scrollHeight;
          statusDiv.textContent = "";
        },

        (error) => {
          console.error(error);
          statusDiv.textContent =
            "Unable to load messages. Check your Firestore rules.";
        }
      );
    }

    // SEND MESSAGE
    messageForm.addEventListener("submit", async (event) => {

      event.preventDefault();

      const text = messageInput.value.trim();

      if (!text || !currentUser) {
        return;
      }

      try {

        await addDoc(collection(db, "messages"), {
          text: text,
          senderId: currentUser.uid,
          senderName:
            currentUser.displayName || currentUser.email,
          createdAt: serverTimestamp()
        });

        messageInput.value = "";
        statusDiv.textContent = "";

      } catch (error) {

        console.error(error);
        statusDiv.textContent =
          "Message failed to send. Please try again.";
      }
    });

    // LOG OUT
    document.getElementById("logout").addEventListener(
      "click",
      async () => {

        try {

          if (unsubscribeMessages) {
            unsubscribeMessages();
          }

          await signOut(auth);

          window.location.href = "/";

        } catch (error) {

          console.error(error);
          statusDiv.textContent = "Logout failed.";
        }
      }
    );

  </script>

</body>
</html>
