<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terzex Chat</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #050505;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  background: #151515;
  border-bottom: 1px solid #d4af37;
  padding: 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  color: #d4af37;
  font-size: 22px;
  font-weight: bold;
}

button {
  background: #d4af37;
  color: black;
  border: none;
  padding: 12px 18px;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

main {
  max-width: 750px;
  margin: auto;
  padding: 20px;
}

.welcome {
  color: #d4af37;
  font-size: 22px;
}

.chatbox {
  background: #151515;
  border: 1px solid #333;
  border-radius: 12px;
  height: 55vh;
  min-height: 300px;
  overflow-y: auto;
  padding: 15px;
  margin-top: 20px;
}

.message {
  background: #252525;
  padding: 12px;
  margin: 10px 0;
  border-radius: 10px;
  overflow-wrap: anywhere;
}

.message strong {
  color: #d4af37;
}

.message small {
  color: #999;
  display: block;
  margin-top: 5px;
}

.composer {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border-radius: 8px;
  background: #222;
  border: 1px solid #555;
  color: white;
  font-size: 16px;
}

#status {
  color: #d4af37;
  margin-top: 12px;
}
</style>
</head>

<body>

<header>
  <div class="logo">⚡ TERZEX CHAT</div>
  <button id="logout">LOG OUT</button>
</header>

<main>
  <h2 class="welcome" id="welcome">Welcome!</h2>
  <p>Connect. Chat. Share.</p>

  <h3>💬 Public Chat</h3>

  <div class="chatbox" id="messages">
    Loading messages...
  </div>

  <div class="composer">
    <input id="messageInput"
      type="text"
      placeholder="Write a message..."
      maxlength="2000">
    <button id="send">SEND</button>
  </div>

  <p id="status"></p>
</main>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  query,
  orderBy,
  limit,
  onSnapshot,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";


/* YOUR FIREBASE CONFIGURATION */

const firebaseConfig = {
  apiKey: "AIzaSyD9EIBvB_1wlUCa2f4XzxjHvulEoELjJ6o",
  authDomain: "terzex-chat.firebaseapp.com",
  projectId: "terzex-chat",
  storageBucket: "terzex-chat.firebasestorage.app",
  messagingSenderId: "439554401022",
  appId: "1:439554401022:web:2eddf4bebb81fab30ffbaf",
  measurementId: "G-9BQYK88HN9"
};


/* FIREBASE SETUP */

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const messagesBox = document.getElementById("messages");
const input = document.getElementById("messageInput");
const status = document.getElementById("status");

let currentUser = null;
let stopListening = null;


/* CHECK LOGIN */

onAuthStateChanged(auth, (user) => {

  if (!user) {
    window.location.href = "/";
    return;
  }

  currentUser = user;

  document.getElementById("welcome").textContent =
    "Welcome, " + (user.displayName || user.email);

  listenForMessages();
});


/* LOAD REAL-TIME MESSAGES */

function listenForMessages() {

  const messagesQuery = query(
    collection(db, "messages"),
    orderBy("createdAt", "asc"),
    limit(100)
  );

  stopListening = onSnapshot(messagesQuery, (snapshot) => {

    messagesBox.innerHTML = "";

    snapshot.forEach((doc) => {

      const data = doc.data();

      const item = document.createElement("div");
      item.className = "message";

      const sender = document.createElement("strong");
      sender.textContent = data.senderName || "User";

      const content = document.createElement("p");
      content.textContent = data.text || "";

      item.appendChild(sender);
      item.appendChild(content);

      messagesBox.appendChild(item);
    });

    messagesBox.scrollTop = messagesBox.scrollHeight;

  }, (error) => {
    status.textContent = "Chat error: " + error.message;
  });
}


/* SEND MESSAGE */

document.getElementById("send").onclick = async () => {

  const text = input.value.trim();

  if (!currentUser || !text) return;

  try {

    await addDoc(collection(db, "messages"), {
      text: text,
      senderId: currentUser.uid,
      senderName: currentUser.displayName || currentUser.email,
      createdAt: serverTimestamp()
    });

    input.value = "";
    status.textContent = "";

  } catch (error) {
    status.textContent = error.message;
  }
};


/* SEND WITH ENTER */

input.addEventListener("keydown", (event) => {
  if (event.key === "Enter") {
    document.getElementById("send").click();
  }
});


/* LOG OUT */

document.getElementById("logout").onclick = async () => {

  if (stopListening) stopListening();

  await signOut(auth);

  window.location.href = "/";
};

</script>

</body>
</html>
